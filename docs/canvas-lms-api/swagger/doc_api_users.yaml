openapi: 3.0.0
info:
  title: Canvas LMS Users API
  version: 1.0.0
paths:
  /api/v1/accounts/{account_id}/users:
    get:
      summary: List users in account
      description: A paginated list of users associated with this account.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          description: ID of the account
          required: true
          schema:
            type: string
        - name: search_term
          in: query
          description: >
            The partial name or full ID of the users to match and return in the results list. Must be at least 3 characters.
          schema:
            type: string
        - name: enrollment_type
          in: query
          description: >
            When set, only return users enrolled with the specified course-level base role. Allowed values: student, teacher, ta, observer, designer.
          schema:
            type: string
        - name: sort
          in: query
          description: The column to sort results by.
          schema:
            type: string
            enum:
              - username
              - email
              - sis_id
              - integration_id
              - last_login
        - name: order
          in: query
          description: The order to sort the given column by.
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: include_deleted_users
          in: query
          description: >
            When set to true and used with an account context, returns users who have deleted pseudonyms for the context.
          schema:
            type: boolean
      responses:
        '200':
          description: A list of User objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sortable_name:
          type: string
        last_name:
          type: string
        first_name:
          type: string
        short_name:
          type: string
        sis_user_id:
          type: string
        sis_import_id:
          type: integer
        integration_id:
          type: string
        login_id:
          type: string
        avatar_url:
          type: string
        avatar_state:
          type: string
        enrollments:
          type: array
          items:
            type: object
        email:
          type: string
        locale:
          type: string
        last_login:
          type: string
          format: date-time
        time_zone:
          type: string
        bio:
          type: string
        pronouns:
          type: string
      required:
        - id
        - name
        - sortable_name
        - last_name
        - first_name
        - short_name