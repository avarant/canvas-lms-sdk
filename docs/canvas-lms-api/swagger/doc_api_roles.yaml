openapi: 3.0.0
info:
  title: Canvas LMS Roles API
  version: "1.0.0"
servers:
  - url: https://{{canvasDomain}}
paths:
  /api/v1/accounts/{account_id}/roles:
    get:
      summary: A paginated list of the roles available to an account.
      operationId: listRoles
      tags:
        - Roles
      parameters:
        - name: account_id
          in: path
          description: The id of the account to retrieve roles for.
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: Filter by role state. If omitted, only 'active' roles are returned.
          schema:
            type: array
            items:
              type: string
              enum:
                - active
                - inactive
        - name: show_inherited
          in: query
          description: If true, all roles inherited from parent accounts will be included.
          schema:
            type: boolean
      responses:
        "200":
          description: A list of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
    post:
      summary: Create a new course-level or account-level role.
      operationId: createRole
      tags:
        - Roles
      parameters:
        - name: account_id
          in: path
          description: The id of the account.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  description: Label for the role.
                role:
                  type: string
                  description: Deprecated alias for label.
                base_role_type:
                  type: string
                  description: Specifies the role type used as a base for permissions.
                  enum:
                    - AccountMembership
                    - StudentEnrollment
                    - TeacherEnrollment
                    - TaEnrollment
                    - ObserverEnrollment
                    - DesignerEnrollment
                permissions:
                  type: object
                  description: A dictionary of permissions keyed by name.
                  additionalProperties:
                    $ref: '#/components/schemas/RolePermissionModification'
      responses:
        "200":
          description: The created role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found

  /api/v1/accounts/{account_id}/roles/{id}:
    get:
      summary: Retrieve information about a single role.
      operationId: getRole
      tags:
        - Roles
      parameters:
        - name: account_id
          in: path
          description: The id of the account containing the role.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: The unique identifier for the role.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A role object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
    delete:
      summary: Deactivate a role.
      operationId: deactivateRole
      tags:
        - Roles
      parameters:
        - name: account_id
          in: path
          description: The id of the account.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: The unique identifier for the role.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The deactivated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
    put:
      summary: Update permissions for an existing role.
      operationId: updateRole
      tags:
        - Roles
      parameters:
        - name: account_id
          in: path
          description: The id of the account.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: The unique identifier for the role.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: The label for the role. Can only change a custom role's label.
                permissions:
                  type: object
                  description: A dictionary of permissions keyed by name.
                  additionalProperties:
                    $ref: '#/components/schemas/RolePermissionModification'
      responses:
        "200":
          description: The updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found

  /api/v1/accounts/{account_id}/roles/{id}/activate:
    post:
      summary: Re-activates an inactive role.
      operationId: activateRole
      tags:
        - Roles
      parameters:
        - name: account_id
          in: path
          description: The id of the account.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: The unique identifier for the role.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The activated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RolePermissionModification:
      type: object
      properties:
        explicit:
          type: boolean
        enabled:
          type: boolean
        locked:
          type: boolean
        applies_to_self:
          type: boolean
        applies_to_descendants:
          type: boolean
    RolePermissions:
      type: object
      properties:
        enabled:
          type: boolean
        locked:
          type: boolean
        applies_to_self:
          type: boolean
        applies_to_descendants:
          type: boolean
        readonly:
          type: boolean
        explicit:
          type: boolean
        prior_default:
          type: boolean
    Account:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parent_account_id:
          type: integer
        root_account_id:
          type: integer
        sis_account_id:
          type: string
    Role:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        role:
          type: string
        base_role_type:
          type: string
        is_account_role:
          type: boolean
        account:
          $ref: '#/components/schemas/Account'
        workflow_state:
          type: string
          enum:
            - active
            - inactive
            - built_in
        created_at:
          type: string
          format: date-time
        last_updated_at:
          type: string
          format: date-time
        permissions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RolePermissions'
security:
  - bearerAuth: []