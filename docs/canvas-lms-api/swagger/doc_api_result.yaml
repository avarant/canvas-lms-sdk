openapi: 3.0.0
info:
  title: Canvas LMS LTI Result API
  version: 1.0.0
  description: Result API for IMS Assignment and Grade Services
paths:
  /api/lti/courses/{course_id}/line_items/{line_item_id}/results:
    get:
      summary: Show a collection of Results
      description: >-
        Show existing Results of a line item. Can filter by user_id
        to retrieve a specific student's result. May also limit
        the number of results with the limit query parameter.
      parameters:
        - name: course_id
          in: path
          description: Canvas Course ID
          required: true
          schema:
            type: integer
        - name: line_item_id
          in: path
          description: Line Item ID
          required: true
          schema:
            type: integer
        - name: user_id
          in: query
          description: The lti_user_id or the Canvas user_id to filter results
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Limit number of results returned
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A list of Result objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Result'
  /api/lti/courses/{course_id}/line_items/{line_item_id}/results/{id}:
    get:
      summary: Show a Result
      description: Show existing Result of a line item.
      parameters:
        - name: course_id
          in: path
          description: Canvas Course ID
          required: true
          schema:
            type: integer
        - name: line_item_id
          in: path
          description: Line Item ID
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: Result ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A Result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          description: Result not found
components:
  schemas:
    Result:
      type: object
      description: A result for an LTI Assignment and Grade Services line item
      properties:
        id:
          type: string
          description: The fully qualified URL for showing the Result
        userId:
          type: string
          description: The lti_user_id or the Canvas user_id
        resultScore:
          type: number
          description: The score of the result as defined by Canvas, scaled to resultMaximum
        resultMaximum:
          type: number
          description: Maximum possible score for this result (minimum 0)
        comment:
          type: string
          nullable: true
          description: Comment visible to the student about the result
        scoreOf:
          type: string
          description: URL of the line item this result belongs to
      required:
        - id
        - userId
        - resultScore
        - resultMaximum
        - scoreOf