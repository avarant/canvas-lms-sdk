openapi: 3.0.0
info:
  title: Canvas LMS Course Reports API
  version: "1.0.0"
paths:
  /api/v1/courses/{course_id}/reports/{report_type}/{id}:
    get:
      tags:
        - Course Reports
      summary: Status of a Report
      description: Returns the status of a report.
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          description: The id of the course to report on.
          required: true
          schema:
            type: integer
        - name: report_type
          in: path
          description: The type of report to generate.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: The id of the report.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A Report object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
              example:
                id: 1
                file_url: https://example.com/some/path
                attachment: null
                status: complete
                created_at: '2013-12-01T23:59:00-06:00'
                started_at: '2013-12-02T00:03:21-06:00'
                ended_at: '2013-12-02T00:03:21-06:00'
                parameters:
                  course_id: 2
                  start_at: '2012-07-13T10:55:20-06:00'
                  end_at: '2012-07-13T10:55:20-06:00'
        '404':
          description: Report not found
        '500':
          description: Internal server error

  /api/v1/courses/{course_id}/reports/{report_type}:
    post:
      tags:
        - Course Reports
      summary: Start a Report
      description: Generates a report instance for the course. The report type must match one of the available report names.
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          description: The id of the course to report on.
          required: true
          schema:
            type: integer
        - name: report_type
          in: path
          description: The type of report to generate.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  type: object
                  description: The parameters will vary for each report.
                  additionalProperties: true
              example:
                parameters:
                  section_ids: [1,2,3]
      responses:
        '200':
          description: A Report object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Bad Request
        '500':
          description: Internal server error

    get:
      tags:
        - Course Reports
      summary: Status of last Report
      description: Returns the status of the last report initiated by the current user.
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          description: The id of the course to report on.
          required: true
          schema:
            type: integer
        - name: report_type
          in: path
          description: The type of report to generate.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A Report object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found
        '500':
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
  schemas:
    Report:
      type: object
      properties:
        id:
          type: integer
        file_url:
          type: string
          format: uri
        attachment:
          type: object
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        parameters:
          $ref: '#/components/schemas/ReportParameters'
      required:
        - id
        - status
        - created_at
    ReportParameters:
      type: object
      description: The parameters returned will vary for each report.
      additionalProperties: true