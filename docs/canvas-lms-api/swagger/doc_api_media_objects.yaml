      responses:
        '200':
          description: A list of MediaTrack objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaTrack'
        '401':
          description: Unauthorized
    put:
      summary: Replace media tracks for an Attachment
      description: |
        Replace the media tracks associated with a media attachment. Deletes any existing tracks not listed,
        leaves untouched tracks with no content field, and updates or creates tracks with a content field.
      tags:
        - Media Tracks
      parameters:
        - name: attachment_id
          in: path
          description: ID of the media attachment
          required: true
          schema:
            type: integer
        - name: include[]
          in: query
          description: Fields to include in the returned MediaTrack objects
          required: false
          schema:
            type: string
            enum:
              - content
              - webvtt_content
              - created_at
              - updated_at
      requestBody:
        description: An array of media track objects to create or update
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  locale:
                    type: string
                  kind:
                    type: string
                  content:
                    type: string
                  webvtt_content:
                    type: string
                required:
                  - locale
            example:
              - locale: en
              - locale: af
                content: |
                  1
                  00:00:00,000 --> 00:00:01,251
                  This is the content
      responses:
        '200':
          description: A list of MediaTrack objects after update
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaTrack'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /media_objects:
    get:
      summary: List Media Objects
      description: Returns media objects created by the user making the request.
      tags:
        - Media Objects
      parameters:
        - name: sort
          in: query
          description: Field to sort on (default: title)
          schema:
            type: string
            enum:
              - title
              - created_at
        - name: order
          in: query
          description: Sort direction (default: asc)
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: exclude[]
          in: query
          description: Data to exclude to speed up response
          schema:
            type: string
            enum:
              - sources
              - tracks
      responses:
        '200':
          description: A list of MediaObject objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaObject'
        '401':
          description: Unauthorized
  /courses/{course_id}/media_objects:
    get:
      summary: List Media Objects in a Course
      description: Returns media objects associated with the given course.
      tags:
        - Media Objects
      parameters:
        - name: course_id
          in: path
          description: ID of the course
