openapi: 3.0.0
info:
  title: Canvas Developer Keys API
  version: "1.0.0"
paths:
  /api/v1/accounts/{account_id}/developer_keys:
    get:
      summary: List Developer Keys
      description: |
        List all developer keys created in the current account.
      parameters:
        - name: account_id
          in: path
          description: The Canvas account ID.
          required: true
          schema:
            type: integer
        - name: inherited
          in: query
          description: Defaults to false. If true, lists keys inherited from Site Admin (and consortium parent account, if applicable).
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A list of DeveloperKey objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperKey'
    post:
      summary: Create a Developer Key
      description: |
        Create a new Canvas API key. Creating an LTI 1.3 registration is not supported here and should be done via the LTI Registration API.
      parameters:
        - name: account_id
          in: path
          description: The Canvas account ID.
          required: true
          schema:
            type: integer
      requestBody:
        description: Attributes for the new Developer Key
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeveloperKeyInput'
      responses:
        '200':
          description: The created DeveloperKey object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperKey'

  /api/v1/developer_keys/{id}:
    put:
      summary: Update a Developer Key
      description: |
        Update an existing Canvas API key. Updating an LTI 1.3 registration is not supported here and should be done via the LTI Registration API.
      parameters:
        - name: id
          in: path
          description: The Canvas DeveloperKey ID.
          required: true
          schema:
            type: integer
      requestBody:
        description: Attributes to update on the Developer Key
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeveloperKeyInput'
      responses:
        '200':
          description: The updated DeveloperKey object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperKey'
    delete:
      summary: Delete a Developer Key
      description: |
        Delete an existing Canvas API key. Deleting an LTI 1.3 registration should be done via the LTI Registration API.
      parameters:
        - name: id
          in: path
          description: The Canvas DeveloperKey ID.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The deleted DeveloperKey object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperKey'

components:
  schemas:
    DeveloperKeyInput:
      type: object
      required:
        - developer_key
      properties:
        developer_key:
          type: object
          properties:
            auto_expire_tokens:
              type: boolean
              description: Defaults to false. If true, access tokens generated by this key will expire after 1 hour.
            email:
              type: string
              description: Contact email for the key.
            icon_url:
              type: string
              description: URL for a small icon to display in key list.
            name:
              type: string
              description: The display name.
            notes:
              type: string
              description: User-provided notes about the key.
            redirect_uri:
              type: string
              description: Deprecated in favor of redirect_uris. Do not use.
            redirect_uris:
              type: array
              items:
                type: string
              description: List of URLs used during OAuth2 flow to validate given redirect URI.
            vendor_code:
              type: string
              description: User-specified code representing the vendor that uses the key.
            visible:
              type: boolean
              description: Defaults to true. If false, key will not be visible in the UI.
            test_cluster_only:
              type: boolean
              description: Defaults to false. If true, key is only usable in non-production environments (test, beta).
            client_credentials_audience:
              type: string
              description: Used in OAuth2 client credentials flow to specify the audience for the access token.
            scopes:
              type: array
              items:
                type: string
              description: List of API endpoints key is allowed to access.
            require_scopes:
              type: boolean
              description: If true, then token requests with this key must include scopes.
            allow_includes:
              type: boolean
              description: If true, allows ‘includes’ parameters in API requests that match the scopes of this key.
    DeveloperKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        workflow_state:
          type: string
        is_lti_key:
          type: boolean
        email:
          type: string
        icon_url:
          type: string
        notes:
          type: string
        vendor_code:
          type: string
        account_name:
          type: string
        visible:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        redirect_uri:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        access_token_count:
          type: integer
        last_used_at:
          type: string
          format: date-time
        test_cluster_only:
          type: boolean
        allow_includes:
          type: boolean
        require_scopes:
          type: boolean
        client_credentials_audience:
          type: string
        api_key:
          type: string
        tool_configuration:
          type: object
        public_jwk:
          type: object
        public_jwk_url:
          type: string
        lti_registration:
          type: object
        is_lti_registration:
          type: boolean
        user_name:
          type: string
        user_id:
          type: string
      required:
        - id
        - name