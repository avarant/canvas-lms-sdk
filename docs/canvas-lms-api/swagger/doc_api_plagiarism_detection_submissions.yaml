openapi: 3.0.0
info:
  title: Canvas LMS Plagiarism Detection Submissions API
  version: 1.0.0
paths:
  /api/lti/assignments/{assignment_id}/submissions/{submission_id}:
    get:
      summary: Get a single submission
      description: Get a single submission, based on submission id.
      security:
        - bearerAuth: []
      parameters:
        - name: assignment_id
          in: path
          description: ID of the assignment
          required: true
          schema:
            type: integer
        - name: submission_id
          in: path
          description: ID of the submission
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Submission not found
  /api/lti/assignments/{assignment_id}/submissions/{submission_id}/history:
    get:
      summary: Get the history of a single submission
      description: Get a list of all attempts made for a submission, based on submission id.
      security:
        - bearerAuth: []
      parameters:
        - name: assignment_id
          in: path
          description: ID of the assignment
          required: true
          schema:
            type: integer
        - name: submission_id
          in: path
          description: ID of the submission
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of submission attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
        '404':
          description: Submission not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Submission:
      type: object
      properties:
        lti_course_id:
          type: string
          description: LTI course identifier
        course_id:
          type: integer
          description: Canvas course ID
        assignment_id:
          type: integer
          description: The submission's assignment id
        attempt:
          type: integer
          description: The submission attempt number
        body:
          type: string
          description: The content of the submission, if submitted directly in a text field
        submission_type:
          type: string
          description: The type of submission (e.g., online_text_entry, online_url, online_upload, media_recording, student_annotation)
        submitted_at:
          type: string
          format: date-time
          description: Timestamp when the assignment was submitted
        url:
          type: string
          nullable: true
          description: The URL of the submission (for URL submissions)
        user_id:
          type: integer
          description: The ID of the user who created the submission
        eula_agreement_timestamp:
          type: string
          description: UTC timestamp when the user agreed to the EULA
        workflow_state:
          type: string
          description: The current state of the submission
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/File'
          nullable: true
          description: Files attached to the submission
    File:
      type: object
      properties:
        id:
          type: integer
          description: File identifier
        display_name:
          type: string
          description: Name of the file
        size:
          type: integer
          description: Size of the file in bytes
        content-type:
          type: string
          description: MIME type of the file
        url:
          type: string
          description: Download URL for the file
        created_at:
          type: string
          format: date-time
          description: File creation timestamp
        updated_at:
          type: string
          format: date-time
          description: File update timestamp