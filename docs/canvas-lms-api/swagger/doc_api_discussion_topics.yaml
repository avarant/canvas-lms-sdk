components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DiscussionTopic:
      type: object
      description: A discussion topic object.
      properties:
        id:
          type: integer
          description: The ID of this topic.
        title:
          type: string
          description: The topic title.
        message:
          type: string
          description: The HTML content of the message body.
        html_url:
          type: string
          format: uri
          description: The URL to the discussion topic in Canvas.
        posted_at:
          type: string
          format: date-time
          nullable: true
          description: The datetime the topic was posted.
        last_reply_at:
          type: string
          format: date-time
          description: The datetime for when the last reply was in the topic.
        require_initial_post:
          type: boolean
          description: Whether a user may not respond until making an initial reply.
        user_can_see_posts:
          type: boolean
        discussion_subentry_count:
          type: integer
        read_state:
          type: string
          enum: [read, unread]
        unread_count:
          type: integer
        subscribed:
          type: boolean
        subscription_hold:
          type: string
          nullable: true
        assignment_id:
          type: integer
          nullable: true
        delayed_post_at:
          type: string
          format: date-time
          nullable: true
        published:
          type: boolean
        lock_at:
          type: string
          format: date-time
          nullable: true
        locked:
          type: boolean
        pinned:
          type: boolean
        locked_for_user:
          type: boolean
        lock_info:
          type: object
          nullable: true
        lock_explanation:
          type: string
          nullable: true
        user_name:
          type: string
        group_topic_children:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              group_id:
                type: integer
        podcast_url:
          type: string
        discussion_type:
          type: string
          enum: [side_comment, not_threaded, threaded]
        group_category_id:
          type: integer
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FileAttachment'
        permissions:
          type: object
        allow_rating:
          type: boolean
        only_graders_can_rate:
          type: boolean
        sort_order:
          type: string
          enum: [asc, desc]
        sort_order_locked:
          type: boolean
        expand:
          type: boolean
        expand_locked:
          type: boolean
    FileAttachment:
      type: object
      properties:
        content-type:
          type: string
        url:
          type: string
          format: uri
        filename:
          type: string
        display_name:
          type: string
      description: A file attachment object.