openapi: 3.0.0
info:
  title: Canvas LMS Search API
  version: "1.0.0"
paths:
  /api/v1/search/recipients:
    get:
      summary: >
        Find valid recipients (users, courses and groups) that the current user can send messages to.
        The /api/v1/search/recipients path is the preferred endpoint; /api/v1/conversations/find_recipients is deprecated.
        Pagination is supported.
      tags:
        - Search
      parameters:
        - name: search
          in: query
          description: >
            Search terms used for matching users, courses, or groups. If multiple terms are given,
            only results matching all terms will be returned.
          required: false
          schema:
            type: string
        - name: context
          in: query
          description: Limit the search to a particular course or group (e.g. "course_3" or "group_4").
          required: false
          schema:
            type: string
        - name: exclude[]
          in: query
          description: >
            Array of IDs to exclude from the search. These may be user IDs or course/group IDs
            prefixed with "course_" or "group_".
          required: false
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          description: Limit the search to just users or contexts (groups/courses).
          required: false
          schema:
            type: string
            enum:
              - user
              - context
        - name: user_id
          in: query
          description: >
            Search for a specific user ID. This ignores the other parameters and will never
            return more than one result.
          required: false
          schema:
            type: integer
        - name: from_conversation_id
          in: query
          description: >
            When searching by user_id, specify a conversation to reference shared context.
            If both users are in the conversation, the user will be returned.
          required: false
          schema:
            type: integer
        - name: permissions[]
          in: query
          description: >
            Array of permission strings to be checked for each matched context.
            Determines which permissions may be returned in the response.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A list of matching recipients.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: >
                        The unique identifier for the user or context.
                        Prefixed by "group_" or "course_" for contexts.
                    name:
                      type: string
                      description: The name of the context or short name of the user.
                    full_name:
                      type: string
                      description: Only set for users. The full name of the user.
                    avatar_url:
                      type: string
                      description: Avatar image URL for the user or context.
                    type:
                      type: string
                      description: >
                        Type of recipient. Defaults to null (all). "context" encompasses
                        "course", "section" and "group".
                      enum:
                        - context
                        - course
                        - section
                        - group
                        - user
                        - null
                    types:
                      type: array
                      items:
                        type: string
                      description: Array of recipient types to return.
                    user_count:
                      type: integer
                      description: Only set for contexts. Number of messageable users.
                    common_courses:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: >
                        Only set for users. Mapping of course IDs to enrollment types
                        shared with this user.
                    common_groups:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: >
                        Only set for users. Mapping of group IDs to enrollment types
                        shared with this user.
                    permissions:
                      type: object
                      additionalProperties:
                        type: boolean
                      description: >
                        Only set for contexts. Mapping of requested permissions that
                        the context grants the current user.
              example:
                - id: "group_1"
                  name: "the group"
                  type: "context"
                  user_count: 3
                - id: "2"
                  name: "greg"
                  full_name: "greg jones"
                  common_courses: {}
                  common_groups:
                    "1":
                      - "Member"
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
  /api/v1/search/all_courses:
    get:
      summary: A paginated list of all courses visible in the public index.
      tags:
        - Search
      parameters:
        - name: search
          in: query
          description: >
            Search terms used for matching courses. If multiple terms are given,
            only results matching all terms will be returned.
          required: false
          schema:
            type: string
        - name: public_only
          in: query
          description: Only return courses with public content. Defaults to false.
          required: false
          schema:
            type: boolean
        - name: open_enrollment_only
          in: query
          description: Only return courses that allow self enrollment. Defaults to false.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A list of course objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error