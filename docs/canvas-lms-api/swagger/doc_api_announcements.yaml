openapi: 3.0.0
info:
  title: Canvas LMS Announcements API
  version: "1.0.0"
paths:
  /api/v1/announcements:
    get:
      summary: Returns the paginated list of announcements for the given courses and date range
      description: |
        Returns the paginated list of announcements for the given courses and date range.
        Note that a `context_code` field is added to the responses so you can tell which course each announcement belongs to.
      tags:
        - Announcements
      security:
        - bearerAuth: []
      parameters:
        - name: context_codes[]
          in: query
          description: >-
            List of context_codes to retrieve announcements for (for example,
            `course_123`). Only courses are supported. The call will fail unless
            the caller has View Announcements permission in all listed courses.
          required: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: start_date
          in: query
          description: >-
            Only return announcements posted since the start_date (inclusive).
            Defaults to 14 days ago. Format: `yyyy-mm-dd` or ISO 8601
            `YYYY-MM-DDTHH:MM:SSZ`.
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: >-
            Only return announcements posted before the end_date (inclusive).
            Defaults to 28 days from start_date. Format: `yyyy-mm-dd` or ISO 8601
            `YYYY-MM-DDTHH:MM:SSZ`. Announcements scheduled for future posting will
            only be returned to course administrators.
          required: false
          schema:
            type: string
            format: date-time
        - name: available_after
          in: query
          description: >-
            Only return announcements having `locked_at` nil or after
            available_after (exclusive). Format: `yyyy-mm-dd` or ISO 8601
            `YYYY-MM-DDTHH:MM:SSZ`. Effective only for students.
          required: false
          schema:
            type: string
            format: date-time
        - name: active_only
          in: query
          description: >-
            Only return active announcements that have been published. Applies only
            to requesting users that have permission to view unpublished items.
            Defaults to false for users with access to view unpublished items,
            otherwise true and unmodifiable.
          required: false
          schema:
            type: boolean
        - name: latest_only
          in: query
          description: >-
            Only return the latest announcement for each associated context. The
            response will include at most one announcement for each specified
            context in the `context_codes[]` parameter. Defaults to false.
          required: false
          schema:
            type: boolean
        - name: include
          in: query
          description: >-
            Optional list of resources to include with the response. Possible values
            are: `sections`, `sections_user_count`.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - sections
                - sections_user_count
          style: form
          explode: true
      responses:
        '200':
          description: A list of announcements (DiscussionTopic objects)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscussionTopic'
              example:
                - id: 1
                  title: "Hear ye"
                  message: "Henceforth, all assignments must be..."
                  posted_at: "2017-01-31T22:00:00Z"
                  delayed_post_at: null
                  context_code: "course_2"
        '400':
          description: Bad Request – invalid or missing request parameters
        '401':
          description: Unauthorized – authentication failed or missing
        '403':
          description: Forbidden – insufficient permissions to view one or more contexts
        '500':
          description: Internal Server Error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DiscussionTopic:
      type: object
      description: DiscussionTopic resource representing an announcement
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        posted_at:
          type: string
          format: date-time
        delayed_post_at:
          type: string
          format: date-time
          nullable: true
        context_code:
          type: string
      required:
        - id
        - title
        - message
        - posted_at
        - context_code