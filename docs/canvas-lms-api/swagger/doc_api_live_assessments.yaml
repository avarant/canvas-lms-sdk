openapi: 3.0.0
info:
  title: LiveAssessments API
  version: 1.0.0
paths:
  /api/v1/courses/{course_id}/live_assessments/{assessment_id}/results:
    post:
      summary: Creates live assessment results and adds them to a live assessment
      tags:
        - LiveAssessments
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
        - name: assessment_id
          in: path
          description: ID of the live assessment
          required: true
          schema:
            type: integer
      requestBody:
        description: Array of result objects to create
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/LiveAssessmentResultInput'
              required:
                - results
            example:
              results:
                - passed: false
                  assessed_at: "2014-05-26T14:57:23-07:00"
                  links:
                    user: "15"
                - passed: true
                  assessed_at: "2014-05-26T13:05:40-07:00"
                  links:
                    user: "16"
      responses:
        '200':
          description: Successful creation of live assessment results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Result'
    get:
      summary: Returns a paginated list of live assessment results
      tags:
        - LiveAssessments
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
        - name: assessment_id
          in: path
          description: ID of the live assessment
          required: true
          schema:
            type: integer
        - name: user_id
          in: query
          description: If set, restrict results to those for this user
          schema:
            type: integer
      responses:
        '200':
          description: A list of live assessment results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Result'
  /api/v1/courses/{course_id}/live_assessments:
    post:
      summary: Creates or finds an existing live assessment with the given key and aligns it with the linked outcome
      tags:
        - LiveAssessments
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
      requestBody:
        description: Array of assessment objects to create or find
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assessments:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssessmentInput'
              required:
                - assessments
            example:
              assessments:
                - key: "2014-05-27-Outcome-52"
                  title: "Tuesday's LiveAssessment"
                  links:
                    outcome: "1"
      responses:
        '200':
          description: Successful creation or retrieval of live assessments
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: object
                    properties:
                      assessments.results:
                        type: string
                        format: uri
                  assessments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assessment'
    get:
      summary: Returns a paginated list of live assessments
      tags:
        - LiveAssessments
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of live assessments
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: object
                    properties:
                      assessments.results:
                        type: string
                        format: uri
                  assessments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assessment'
components:
  schemas:
    Result:
      type: object
      properties:
        id:
          type: string
        passed:
          type: boolean
        assessed_at:
          type: string
          format: date-time
        links:
          $ref: '#/components/schemas/ResultLinks'
      required:
        - id
        - passed
        - assessed_at
        - links
    ResultLinks:
      type: object
      properties:
        user:
          type: string
        assessor:
          type: string
        assessment:
          type: string
      required:
        - user
        - assessor
        - assessment
    LiveAssessmentResultInput:
      type: object
      properties:
        passed:
          type: boolean
        assessed_at:
          type: string
          format: date-time
        links:
          type: object
          properties:
            user:
              type: string
          required:
            - user
      required:
        - passed
        - assessed_at
        - links
    Assessment:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        title:
          type: string
      required:
        - id
        - key
        - title
    AssessmentInput:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        links:
          type: object
          properties:
            outcome:
              type: string
          required:
            - outcome
      required:
        - key
        - title
        - links