openapi: 3.0.0
info:
  title: Canvas LMS Files API
  version: 1.0.0
paths:
  /api/v1/courses/{course_id}/files/quota:
    get:
      summary: Get quota information for a course
      description: Returns the total and used storage quota for the specified course.
      tags:
        - Files
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quota information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota:
                    type: integer
                    description: Total storage quota in bytes
                  quota_used:
                    type: integer
                    description: Used storage quota in bytes
              example:
                quota: 524288000
                quota_used: 402653184
        '401':
          description: Unauthorized – invalid or missing authentication token
        '404':
          description: Course not found
  /api/v1/groups/{group_id}/files/quota:
    get:
      summary: Get quota information for a group
      description: Returns the total and used storage quota for the specified group.
      tags:
        - Files
      parameters:
        - name: group_id
          in: path
          description: ID of the group
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quota information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota:
                    type: integer
                    description: Total storage quota in bytes
                  quota_used:
                    type: integer
                    description: Used storage quota in bytes
              example:
                quota: 524288000
                quota_used: 402653184
        '401':
          description: Unauthorized – invalid or missing authentication token
        '404':
          description: Group not found
  /api/v1/users/{user_id}/files/quota:
    get:
      summary: Get quota information for a user
      description: Returns the total and used storage quota for the specified user.
      tags:
        - Files
      parameters:
        - name: user_id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quota information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota:
                    type: integer
                    description: Total storage quota in bytes
                  quota_used:
                    type: integer
                    description: Used storage quota in bytes
              example:
                quota: 524288000
                quota_used: 402653184
        '401':
          description: Unauthorized – invalid or missing authentication token
        '404':
          description: User not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT