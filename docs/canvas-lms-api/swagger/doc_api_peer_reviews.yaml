                  type: integer
                  description: User ID of the reviewer to remove
              required:
                - user_id
      responses:
        "200":
          description: The deleted PeerReview object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerReview"
        "4XX":
          description: Client error
        "5XX":
          description: Server error

components:
  schemas:
    PeerReview:
      type: object
      properties:
        id:
          type: integer
        assessor_id:
          type: integer
        asset_id:
          type: integer
        asset_type:
          type: string
        user_id:
          type: integer
        workflow_state:
          type: string
          description: State of the peer review, either "assigned" or "completed"
        user:
          $ref: "#/components/schemas/User"
        assessor:
          $ref: "#/components/schemas/User"
        submission_comments:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionComment"
      required:
        - id
        - assessor_id
        - asset_id
        - asset_type
        - user_id
        - workflow_state

    User:
      type: object
      description: A Canvas User object

    SubmissionComment:
      type: object
      description: A Canvas SubmissionComment object