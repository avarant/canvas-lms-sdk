        "200":
          description: A list of PeerReview objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeerReview"
        "4XX":
          description: Client error
        "5XX":
          description: Server error

    post:
      summary: Create Peer Review
      description: Create a peer review for the submission
      parameters:
        - name: section_id
          in: path
          description: ID of the section
          required: true
          schema:
            type: integer
        - name: assignment_id
          in: path
          description: ID of the assignment
          required: true
          schema:
            type: integer
        - name: submission_id
          in: path
          description: ID of the submission
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: User ID to assign as reviewer
              required:
                - user_id
      responses:
        "200":
          description: The created PeerReview object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerReview"
        "4XX":
          description: Client error
        "5XX":
          description: Server error

    delete:
      summary: Delete Peer Review
      description: Delete a peer review for the submission
      parameters:
        - name: section_id
          in: path
          description: ID of the section
          required: true
          schema:
            type: integer
        - name: assignment_id
          in: path
          description: ID of the assignment
          required: true
