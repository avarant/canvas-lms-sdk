openapi: 3.0.0
info:
  title: Canvas LMS Enrollment Terms API
  version: '1.0'
servers:
  - url: https://{canvasDomain}
    variables:
      canvasDomain:
        default: canvas.example.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnrollmentTerm:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the enrollment term.
        sis_term_id:
          type: string
          description: The SIS id of the term. Only included if the user has permission to view SIS information.
        sis_import_id:
          type: integer
          description: The unique identifier for the SIS import. Only included if the user has permission to manage SIS information.
        name:
          type: string
          description: The name of the term.
        start_at:
          type: string
          format: date-time
          description: The datetime of the start of the term.
        end_at:
          type: string
          format: date-time
          description: The datetime of the end of the term.
        workflow_state:
          type: string
          enum:
            - active
            - deleted
          description: The state of the term.
        overrides:
          type: object
          description: Term date overrides for specific enrollment types.
          additionalProperties:
            type: object
            properties:
              start_at:
                type: string
                format: date-time
              end_at:
                type: string
                format: date-time
        course_count:
          type: integer
          description: The number of courses in the term (available via include).
      required:
        - id
        - name
        - start_at
        - end_at
        - workflow_state
    EnrollmentTermsList:
      type: object
      properties:
        enrollment_terms:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentTerm'
    EnrollmentTermInput:
      type: object
      properties:
        name:
          type: string
          description: The name of the term.
        start_at:
          type: string
          format: date-time
          description: The day/time the term starts. Accepts ISO 8601 format.
        end_at:
          type: string
          format: date-time
          description: The day/time the term ends. Accepts ISO 8601 format.
        sis_term_id:
          type: string
          description: The unique SIS identifier for the term.
        overrides:
          type: object
          description: Term date overrides keyed by enrollment type (StudentEnrollment, TeacherEnrollment, TaEnrollment, DesignerEnrollment).
          additionalProperties:
            type: object
            properties:
              start_at:
                type: string
                format: date-time
              end_at:
                type: string
                format: date-time
      required:
        - name
        - start_at
        - end_at
paths:
  /api/v1/accounts/{account_id}/terms:
    get:
      summary: List enrollment terms
      description: An object with a paginated list of all of the terms in the account.
      tags:
        - Enrollment Terms
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: The account ID.
        - name: workflow_state
          in: query
          description: If set, only returns terms that are in the given state. Defaults to 'active'.
          schema:
            type: array
            items:
              type: string
              enum:
                - active
                - deleted
                - all
        - name: include
          in: query
          description: Array of additional information to include.
          schema:
            type: array
            items:
              type: string
              enum:
                - overrides
                - course_count
        - name: term_name
          in: query
          description: Search keyword matched against term name.
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of enrollment terms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTermsList'
    post:
      summary: Create enrollment term
      description: Create a new enrollment term for the specified account.
      tags:
        - Enrollment Terms
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: The account ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enrollment_term:
                  $ref: '#/components/schemas/EnrollmentTermInput'
      responses:
        '200':
          description: EnrollmentTerm object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTerm'
  /api/v1/accounts/{account_id}/terms/{id}:
    get:
      summary: Retrieve enrollment term
      description: Retrieves the details for an enrollment term in the account. Includes overrides by default.
      tags:
        - Enrollment Terms
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: The account ID.
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The enrollment term ID.
      responses:
        '200':
          description: EnrollmentTerm object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTerm'
    put:
      summary: Update enrollment term
      description: Update an existing enrollment term for the specified account.
      tags:
        - Enrollment Terms
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: The account ID.
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The enrollment term ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enrollment_term:
                  $ref: '#/components/schemas/EnrollmentTermInput'
                override_sis_stickiness:
                  type: boolean
                  description: Default is true. If false, any fields containing “sticky” changes will not be updated.
      responses:
        '200':
          description: EnrollmentTerm object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTerm'
    delete:
      summary: Delete enrollment term
      description: Delete the specified enrollment term.
      tags:
        - Enrollment Terms
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: The account ID.
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The enrollment term ID.
      responses:
        '200':
          description: EnrollmentTerm object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTerm'