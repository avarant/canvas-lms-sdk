  '/api/v1/courses/{course_id}/lti_resource_links':
    get:
      summary: Returns all Resource Links in the specified course
      description: >
        Returns all Resource Links in the specified course. This includes links
        that are associated with

        Assignments, Module Items, Collaborations, and that are embedded in rich
        content. This endpoint

        is paginated and will return 50 links per page by default. Links are
