                    is_top_nav_favorite:
                      type: boolean
                    account_navigation:
                      type: object
                    assignment_selection:
                      nullable: true
                      type: object
                    course_navigation:
                      nullable: true
                      type: object
                    editor_button:
                      nullable: true
                      type: object
                    selection_width:
                      type: integer
                    selection_height:
                      type: integer
