  '/api/v1/accounts/{account_id}/outcome_imports':
    post:
      summary: Import outcomes into Canvas
      description: >
        Import outcomes into Canvas. For more information on the expected
        format, see the “Outcomes CSV” section in the API docs.
      tags:
        - Outcome Imports
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          description: ID of the account
          required: true
          schema:
            type: integer
        - name: import_type
          in: query
          description: >-
            Choose the data format for reading outcome data. With a standard
            Canvas install, this option can only be ‘instructure_csv’, and if
            unprovided, will be assumed to be so.
          required: false
          schema:
            type: string
        - name: extension
          in: query
          description: >-
            Recommended for raw post request style imports. This field will be
            used to distinguish between csv and other file format extensions
            that would usually be provided with the filename in the multipart
            post request scenario. If not provided, this value will be inferred
            from the Content-Type, falling back to csv-file format if all else
            fails.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  format: binary
                  description: >
                    File upload field named “attachment” containing outcome
                    data.
                import_type:
                  type: string
                extension:
                  type: string
          text/csv:
            schema:
              type: string
              format: binary
            description: |
              Raw CSV post. Provide a suitable Content-Type header.
      responses:
        '200':
          description: OutcomeImport object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeImport'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Account or resource not found
