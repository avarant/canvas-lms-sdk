          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error3'
      security:
        - bearerAuth: []
  '/api/v1/courses/{course_id}/assignment_groups':
    get:
      summary: List assignment groups
      description: >-
        Returns the paginated list of assignment groups for the current context.
        The returned groups are sorted by their position field.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: include
          in: query
          description: >-
            Associations to include with the group. “discussion_topic”,
            “all_dates”, “can_edit”, “assignment_visibility” & “submission” are
            only valid if “assignments” is also included. “score_statistics”
            requires that the “assignments” and “submission” options are
            included. The “assignment_visibility” option additionally requires
            that the Differentiated Assignments course feature be turned on. If
            “observed_users” is passed along with “assignments” and
            “submission”, submissions for observed users will also be included.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - assignments
                - discussion_topic
                - all_dates
                - assignment_visibility
                - overrides
                - submission
                - observed_users
                - can_edit
                - score_statistics
        - name: assignment_ids
          in: query
          description: >-
            If “assignments” are included, optionally return only assignments
            having their ID in this array. This argument may also be passed as a
            comma separated string.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: exclude_assignment_submission_types
          in: query
          description: >-
            If “assignments” are included, those with the specified submission
            types will be excluded from the assignment groups.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - online_quiz
                - discussion_topic
                - wiki_page
                - external_tool
        - name: override_assignment_dates
          in: query
          description: 'Apply assignment overrides for each assignment, defaults to true.'
          required: false
          schema:
            type: boolean
        - name: grading_period_id
          in: query
          description: >-
            The id of the grading period in which assignment groups are being
            requested (Requires grading periods to exist.)
          required: false
          schema:
            type: integer
        - name: scope_assignments_to_student
          in: query
          description: >-
            If true, all assignments returned will apply to the current user in
            the specified grading period. If assignments apply to other students
            in the specified grading period, but not the current user, they will
            not be returned. (Requires the grading_period_id argument and
            grading periods to exist. In addition, the current user must be a
            student.)
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successful response with a list of AssignmentGroup objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentGroup'
    post:
      summary: Create an Assignment Group
      description: Create a new assignment group for this course.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The assignment group’s name
                position:
                  type: integer
                  description: >-
                    The position of this assignment group in relation to the
                    other assignment groups
                group_weight:
                  type: number
                  description: >-
                    The percent of the total grade that this assignment group
                    represents
                sis_source_id:
                  type: string
                  description: The sis source id of the Assignment Group
                integration_data:
                  type: object
                  additionalProperties:
                    type: string
                  description: The integration data of the Assignment Group
      responses:
        '201':
          description: AssignmentGroup created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentGroup'
