        - name: account_id
          in: path
          required: true
          schema:
            type: integer
        - name: collaboration_state
          in: query
          schema:
            type: string
            enum:
              - all
              - collaborative
              - non_collaborative
          description: >
            Filter by collaboration state: 'all', 'collaborative' (default), or
            'non_collaborative'.
      responses:
        '200':
          description: A list of GroupCategory objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupCategory'
      security:
        - bearerAuth: []
    post:
      summary: Create a Group Category in an account
      description: Create a new group category under an account.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the group category.
                non_collaborative:
                  type: boolean
                  description: >-
                    Only users with the Differentiated Tag Add permission can
                    set.
                self_signup:
                  type: string
                  enum:
                    - enabled
                    - restricted
                  description: |
                    Allow students to self sign up (course only).
                auto_leader:
                  type: string
                  enum:
                    - first
                    - random
                  description: Auto-assign group leaders.
                group_limit:
                  type: integer
                  description: Limit number of users per group (requires self_signup).
                sis_group_category_id:
                  type: string
                  description: SIS identifier.
                create_group_count:
                  type: integer
                  description: Create this number of groups (course only).
                split_group_count:
                  type: integer
                  description: Deprecated. Evenly distribute students synchronously.
      responses:
        '200':
          description: The created GroupCategory object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
      security:
        - bearerAuth: []
