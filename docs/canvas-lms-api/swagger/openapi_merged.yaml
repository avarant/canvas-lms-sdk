  '/api/v1/submissions/{id}/what_if_grades':
    put:
      summary: Update a submission's what-if score and calculate grades
      description: >
        Enter a what-if score for a submission and receive the calculated
        grades.

        Grade calculation is a costly operation, so this API should be used
        sparingly.
      parameters:
        - name: id
          in: path
          description: Submission ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_entered_score:
                  type: number
                  description: The score the student wants to test
              required:
                - student_entered_score
      responses:
        '200':
          description: A list of Grades objects and the submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  grades:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grades'
                  submission:
                    $ref: '#/components/schemas/Submission'
              example:
                grades:
                  - current:
                      grade: 120
                      total: 24
                      possible: 20
                      dropped: []
                    current_groups:
                      '1':
                        id: 1
                        global_id: 10000000000001
                        score: 20
                        possible: 10
                        weight: 0
                        grade: 200
                        dropped: []
                      '3':
                        id: 3
                        global_id: 10000000000003
                        score: 4
                        possible: 10
                        weight: 0
                        grade: 40
                        dropped: []
                    final:
                      grade: 21.82
                      total: 24
                      possible: 110
                      dropped: []
                    final_groups:
                      '1':
                        id: 1
                        global_id: 10000000000001
                        score: 20
                        possible: 100
                        weight: 0
                        grade: 20
                        dropped: []
                      '3':
                        id: 3
                        global_id: 10000000000003
                        score: 4
                        possible: 10
                        weight: 0
                        grade: 40
                        dropped: []
                submission:
                  id: 166
                  student_entered_score: 20
