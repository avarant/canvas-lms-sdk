  /api/v1/conversations:
    get:
      summary: List conversations
      description: >-
        Returns the paginated list of conversations for the current user, most
        recent ones first.
      tags:
        - Conversations
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          description: >
            When set, only return conversations of the specified type. For
            example, set to “unread” to return only conversations that haven’t
            been read. The default behavior is to return all non-archived
            conversations (i.e. read and unread).
          required: false
          schema:
            type: string
            enum:
              - unread
              - starred
              - archived
              - sent
        - name: 'filter[]'
          in: query
          description: >
            When set, only return conversations for the specified courses,
            groups or users. The id should be prefixed with its type, e.g.
            “user_123” or “course_456”. Can be an array (by setting “filter[]”)
            or single value (by setting “filter”).
          required: false
          schema:
            type: array
            items:
              type: string
        - name: filter_mode
          in: query
          description: >
            When filter[] contains multiple filters, combine them with this
            mode, filtering conversations that have at least all of the contexts
            (“and”) or at least one of the contexts (“or”).
          required: false
          schema:
            type: string
            enum:
              - and
              - or
              - default or
        - name: interleave_submissions
          in: query
          description: >-
            (Obsolete) Submissions are no longer linked to conversations. This
            parameter is ignored.
          required: false
          schema:
            type: boolean
        - name: include_all_conversation_ids
          in: query
          description: >
            Default is false. If true, the top-level element of the response
            will be an object rather than an array, and will have the keys
            “conversations” which will contain the paged conversation data, and
            “conversation_ids” which will contain the ids of all conversations
            under this scope/filter in the same order.
          required: false
          schema:
            type: boolean
        - name: 'include[]'
          in: query
          description: >
            Optionally include an “avatar_url” key for each user participating
            in the conversation.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - participant_avatars
      responses:
        '200':
          description: A list of Conversation objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
              examples:
                example:
                  summary: Sample response
                  value:
                    - id: 2
                      subject: conversations api example
                      workflow_state: unread
                      last_message: 'sure thing, here''s the file'
                      last_message_at: '2011-09-02T12:00:00Z'
                      message_count: 2
                      subscribed: true
                      private: true
                      starred: false
                      properties:
                        - attachments
                      audience:
                        - 2
                      audience_contexts:
                        courses:
                          '1':
                            - StudentEnrollment
                        groups: {}
                      avatar_url: >-
                        https://canvas.instructure.com/images/messages/avatar-group-50.png
                      participants:
                        - id: 1
                          name: Joe
                          full_name: Joe TA
                        - id: 2
                          name: Jane
                          full_name: Jane Teacher
                      visible: true
                      context_name: Canvas 101
