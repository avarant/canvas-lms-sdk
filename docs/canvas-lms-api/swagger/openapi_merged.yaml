            account, course_progress, sections, storage_quota_used_mb,
            total_students, passback_status, favorites, teachers,
            observed_users, tabs, course_image, banner_image, concluded,
            post_manually.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - needs_grading_count
                - syllabus_body
                - public_description
                - total_scores
                - current_grading_period_scores
                - grading_periods
                - term
                - account
                - course_progress
                - sections
                - storage_quota_used_mb
                - total_students
                - passback_status
                - favorites
                - teachers
                - observed_users
                - tabs
                - course_image
                - banner_image
                - concluded
                - post_manually
        - name: 'state[]'
          in: query
          description: 'If set, only return courses that are in the given state(s).'
