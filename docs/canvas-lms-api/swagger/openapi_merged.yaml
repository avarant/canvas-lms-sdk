openapi: 3.0.3
info:
  title: User Observees API
  version: '1.0'
servers:
  - url: 'https://{canvas}/api/v1'
    variables:
      canvas:
        default: canvas.instructure.com
security: []
tags:
  - name: WebhookSubscriptions
    description: >-
      Operations related to webhook subscriptions for the Plagiarism Detection
      Platform.
paths:
  '/api/v1/users/{user_id}/observees':
    get:
      summary: List observees
      description: >
        A paginated list of the users that the given user is observing.

        Note: all users are allowed to list their own observees. Administrators
        can list other users’ observees.

        The returned observees will include an attribute
        “observation_link_root_account_ids”, a list of ids for the root accounts
        the observer and observee are linked on.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the user.
        - name: 'include[]'
          in: query
          schema:
            type: string
            enum:
              - avatar_url
          description: Optionally include avatar_url.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of observed users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Add an observee with credentials
      description: >
        Register the given user to observe another user, given the observee’s
        credentials.

        Note: all users are allowed to add their own observees, given the
        observee’s credentials or access token are provided.

        Administrators can add observees given credentials, access token or the
        observee’s id.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the observer user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                observee:
                  type: object
                  properties:
                    unique_id:
                      type: string
                      description: >-
                        The login id for the user to observe. Required if
                        access_token is omitted.
                    password:
                      type: string
                      description: >-
                        The password for the user to observe. Required if
                        access_token is omitted.
                access_token:
                  type: string
                  description: >-
                    The access token for the user to observe. Required if
                    observee.unique_id or observee.password are omitted.
                pairing_code:
                  type: string
                  description: >-
                    A generated pairing code for the user to observe. Required
                    if the Observer pairing code feature flag is enabled.
                root_account_id:
                  type: integer
                  description: >-
                    The ID for the root account to associate with the
                    observation link. Defaults to the current domain account. If
                    ‘all’ is specified, a link will be created for each root
                    account associated to both the observer and observee.
      responses:
        '200':
          description: The newly observed User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  '/api/v1/users/{user_id}/observees/{observee_id}':
    get:
      summary: Show an observee
      description: >
        Gets information about an observed user. Note: all users are allowed to
        view their own observees.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: observee_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The observed User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      summary: Add an observee
      description: Registers a user as being observed by the given user.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: observee_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                root_account_id:
                  type: integer
                  description: >-
                    The ID for the root account to associate with the
                    observation link. If not specified, a link will be created
                    for each root account associated to both the observer and
                    observee.
      responses:
        '200':
          description: The updated User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      summary: Remove an observee
      description: Unregisters a user as being observed by the given user.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: observee_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                root_account_id:
                  type: integer
                  description: >-
                    If specified, only removes the link for the given root
                    account.
      responses:
        '200':
          description: The updated User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  '/api/v1/users/{user_id}/observers':
    get:
      summary: List observers
      description: >
        A paginated list of the observers of a given user.

        Note: all users are allowed to list their own observers. Administrators
        can list other users’ observers.

        The returned observers will include an attribute
        “observation_link_root_account_ids”, a list of ids for the root accounts
        the observer and observee are linked on.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: 'include[]'
          in: query
          schema:
            type: string
            enum:
              - avatar_url
          description: Optionally include avatar_url.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of observer User objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  '/api/v1/users/{user_id}/observers/{observer_id}':
    get:
      summary: Show an observer
      description: |
        Gets information about an observer.
        Note: all users are allowed to view their own observers.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: observer_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The observer User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  '/api/v1/users/{user_id}/observer_pairing_codes':
    post:
      summary: Create observer pairing code
      description: >-
        If the user is a student, will generate a code to be used with self
        registration or observees APIs to link another user to this student.
      tags:
        - User Observees
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A pairing code object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
  '/api/v1/courses/{course_id}/sections':
    get:
      summary: A paginated list of the sections for this course.
      parameters:
        - name: course_id
          in: path
          description: ID of the course.
          required: true
          schema:
            type: integer
        - name: include
          in: query
          description: Associations to include with the section.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - students
                - avatar_url
                - enrollments
                - total_students
                - passback_status
                - permissions
        - name: search_term
          in: query
          description: 'Search term for course sections, minimum 2 characters.'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of Section objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Section'
    post:
      summary: Creates a new section for this course.
      parameters:
        - name: course_id
          in: path
          description: ID of the course.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                course_section:
                  type: object
                  properties:
                    name:
                      type: string
                    sis_section_id:
                      type: string
                    integration_id:
                      type: string
                    start_at:
                      type: string
                      format: date-time
                    end_at:
                      type: string
                      format: date-time
                    restrict_enrollments_to_section_dates:
                      type: boolean
                enable_sis_reactivation:
                  type: boolean
      responses:
        '201':
          description: Section created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
  '/api/v1/sections/{id}/crosslist/{new_course_id}':
    post:
      summary: Move the section to another course.
      parameters:
        - name: id
          in: path
          description: ID of the section.
          required: true
          schema:
            type: integer
        - name: new_course_id
          in: path
          description: ID of the new course.
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                override_sis_stickiness:
                  type: boolean
      responses:
        '200':
          description: Section cross-listed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
  '/api/v1/sections/{id}/crosslist':
    delete:
      summary: Undo cross-listing of a Section.
      parameters:
        - name: id
          in: path
          description: ID of the section.
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                override_sis_stickiness:
                  type: boolean
      responses:
        '200':
          description: Section de-cross-listed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
  '/api/v1/sections/{id}':
    put:
      summary: Modify an existing section.
      parameters:
        - name: id
          in: path
          description: ID of the section.
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                course_section:
                  type: object
                  properties:
                    name:
                      type: string
                    sis_section_id:
                      type: string
                    integration_id:
                      type: string
                    start_at:
                      type: string
                      format: date-time
                    end_at:
                      type: string
                      format: date-time
                    restrict_enrollments_to_section_dates:
                      type: boolean
                override_sis_stickiness:
                  type: boolean
      responses:
        '200':
          description: Section updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
    get:
      summary: Gets details about a specific section.
      parameters:
        - name: id
          in: path
          description: ID of the section.
          required: true
          schema:
            type: integer
        - name: include
          in: query
          description: Associations to include with the section.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - students
                - avatar_url
                - enrollments
                - total_students
                - passback_status
                - permissions
      responses:
        '200':
          description: A Section object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
    delete:
      summary: Delete an existing section.
      parameters:
        - name: id
          in: path
          description: ID of the section.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Section deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
  '/api/v1/courses/{course_id}/sections/{id}':
    get:
      summary: Gets details about a specific section.
      parameters:
        - name: course_id
          in: path
          description: ID of the course.
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: ID of the section.
          required: true
          schema:
            type: integer
        - name: include
          in: query
          description: Associations to include with the section.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - students
                - avatar_url
                - enrollments
                - total_students
                - passback_status
                - permissions
      responses:
        '200':
          description: A Section object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
  /api/v1/search/recipients:
    get:
      summary: >
        Find valid recipients (users, courses and groups) that the current user
        can send messages to. The /api/v1/search/recipients path is the
        preferred endpoint; /api/v1/conversations/find_recipients is deprecated.
        Pagination is supported.
      tags:
        - Search
      parameters:
        - name: search
          in: query
          description: >
            Search terms used for matching users, courses, or groups. If
            multiple terms are given, only results matching all terms will be
            returned.
          required: false
          schema:
            type: string
        - name: context
          in: query
          description: >-
            Limit the search to a particular course or group (e.g. "course_3" or
            "group_4").
          required: false
          schema:
            type: string
        - name: 'exclude[]'
          in: query
          description: >
            Array of IDs to exclude from the search. These may be user IDs or
            course/group IDs prefixed with "course_" or "group_".
          required: false
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          description: Limit the search to just users or contexts (groups/courses).
          required: false
          schema:
            type: string
            enum:
              - user
              - context
        - name: user_id
          in: query
          description: >
            Search for a specific user ID. This ignores the other parameters and
            will never return more than one result.
          required: false
          schema:
            type: integer
        - name: from_conversation_id
          in: query
          description: >
            When searching by user_id, specify a conversation to reference
            shared context. If both users are in the conversation, the user will
            be returned.
          required: false
          schema:
            type: integer
        - name: 'permissions[]'
          in: query
          description: >
            Array of permission strings to be checked for each matched context.
            Determines which permissions may be returned in the response.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A list of matching recipients.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: >
                        The unique identifier for the user or context. Prefixed
                        by "group_" or "course_" for contexts.
                    name:
                      type: string
                      description: The name of the context or short name of the user.
                    full_name:
                      type: string
                      description: Only set for users. The full name of the user.
                    avatar_url:
                      type: string
                      description: Avatar image URL for the user or context.
                    type:
                      type: string
                      description: >
                        Type of recipient. Defaults to null (all). "context"
                        encompasses "course", "section" and "group".
                      enum:
                        - context
                        - course
                        - section
                        - group
                        - user
                        - null
                    types:
                      type: array
                      items:
                        type: string
                      description: Array of recipient types to return.
                    user_count:
                      type: integer
                      description: Only set for contexts. Number of messageable users.
                    common_courses:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: >
                        Only set for users. Mapping of course IDs to enrollment
                        types shared with this user.
                    common_groups:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                      description: >
                        Only set for users. Mapping of group IDs to enrollment
                        types shared with this user.
                    permissions:
                      type: object
                      additionalProperties:
                        type: boolean
                      description: >
                        Only set for contexts. Mapping of requested permissions
                        that the context grants the current user.
              example:
                - id: group_1
                  name: the group
                  type: context
                  user_count: 3
                - id: '2'
                  name: greg
                  full_name: greg jones
                  common_courses: {}
                  common_groups:
                    '1':
                      - Member
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
  /api/v1/search/all_courses:
    get:
      summary: A paginated list of all courses visible in the public index.
      tags:
        - Search
      parameters:
        - name: search
          in: query
          description: >
            Search terms used for matching courses. If multiple terms are given,
            only results matching all terms will be returned.
          required: false
          schema:
            type: string
        - name: public_only
          in: query
          description: Only return courses with public content. Defaults to false.
          required: false
          schema:
            type: boolean
        - name: open_enrollment_only
          in: query
          description: Only return courses that allow self enrollment. Defaults to false.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A list of course objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
  '/accounts/{account_id}/tabs':
    get:
      summary: List available tabs for an account
      tags:
        - Tabs
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the account
        - name: 'include[]'
          in: query
          required: false
          schema:
            type: string
            enum:
              - course_subject_tabs
          description: >
            "course_subject_tabs": Optional flag to return the tabs associated
            with a canvas_for_elementary subject course’s home page instead of
            the typical sidebar navigation.
      responses:
        '200':
          description: A paginated list of navigation tabs available in the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tab'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/courses/{course_id}/tabs':
    get:
      summary: List available tabs for a course
      tags:
        - Tabs
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the course
        - name: 'include[]'
          in: query
          required: false
          schema:
            type: string
            enum:
              - course_subject_tabs
          description: >
            "course_subject_tabs": Optional flag to return the tabs associated
            with a canvas_for_elementary subject course’s home page instead of
            the typical sidebar navigation.
      responses:
        '200':
          description: A paginated list of navigation tabs available in the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tab'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a tab for a course
      tags:
        - Tabs
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the course
        - name: tab_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the tab to update
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                position:
                  type: integer
                  description: The new position of the tab (1-based)
                hidden:
                  type: boolean
                  description: Whether the tab is hidden
      responses:
        '200':
          description: The updated tab object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tab'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/groups/{group_id}/tabs':
    get:
      summary: List available tabs for a group
      tags:
        - Tabs
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the group
        - name: 'include[]'
          in: query
          required: false
          schema:
            type: string
            enum:
              - course_subject_tabs
          description: >
            "course_subject_tabs": Optional flag to return the tabs associated
            with a canvas_for_elementary subject course’s home page instead of
            the typical sidebar navigation.
      responses:
        '200':
          description: A paginated list of navigation tabs available in the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tab'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/users/{user_id}/tabs':
    get:
      summary: List available tabs for a user
      tags:
        - Tabs
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user
        - name: 'include[]'
          in: query
          required: false
          schema:
            type: string
            enum:
              - course_subject_tabs
          description: >
            "course_subject_tabs": Optional flag to return the tabs associated
            with a canvas_for_elementary subject course’s home page instead of
            the typical sidebar navigation.
      responses:
        '200':
          description: A paginated list of navigation tabs available for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tab'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/v1/accounts/{account_id}/temporary_enrollment_pairings':
    get:
      summary: List temporary enrollment pairings
      parameters:
        - $ref: '#/components/parameters/account_id'
      responses:
        '200':
          description: A list of TemporaryEnrollmentPairing objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemporaryEnrollmentPairing'
    post:
      summary: Create Temporary Enrollment Pairing
      parameters:
        - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow_state:
                  type: string
                  description: The workflow state of the temporary enrollment pairing.
                ending_enrollment_state:
                  type: string
                  description: >-
                    The ending enrollment state to be given to each associated
                    enrollment when the enrollment period has been reached.
                  enum:
                    - deleted
                    - completed
                    - inactive
              additionalProperties: false
      responses:
        '200':
          description: TemporaryEnrollmentPairing created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryEnrollmentPairing'
  '/api/v1/accounts/{account_id}/temporary_enrollment_pairings/new':
    get:
      summary: Initialize an unsaved TemporaryEnrollmentPairing
      parameters:
        - $ref: '#/components/parameters/account_id'
      responses:
        '200':
          description: An unsaved TemporaryEnrollmentPairing object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryEnrollmentPairing'
  '/api/v1/accounts/{account_id}/temporary_enrollment_pairings/{id}':
    get:
      summary: Get a single temporary enrollment pairing
      parameters:
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/id'
