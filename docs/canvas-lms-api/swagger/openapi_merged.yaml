          description: The SIS import ID if created through SIS.
        storage_quota_mb:
          type: integer
          description: The storage quota for the group in megabytes.
        non_collaborative:
          type: boolean
          nullable: true
          description: Whether this group category is non-collaborative.
        permissions:
          type: object
          nullable: true
          description: Permissions the user has for the group.
        users:
          type: array
          nullable: true
          description: A list of users that are members in the group.
          items:
            $ref: '#/components/schemas/User2'
      required:
        - id
        - name
    User2:
      type: object
      description: A Canvas user (simplified)
      properties:
        id:
          type: integer
        name:
          type: string
        sortable_name:
          type: string
        avatar_url:
          type: string
      required:
        - id
        - name
    DeveloperKeyInput:
      type: object
      required:
        - developer_key
      properties:
        developer_key:
          type: object
          properties:
            auto_expire_tokens:
              type: boolean
              description: >-
                Defaults to false. If true, access tokens generated by this key
                will expire after 1 hour.
            email:
              type: string
              description: Contact email for the key.
            icon_url:
              type: string
              description: URL for a small icon to display in key list.
            name:
              type: string
              description: The display name.
            notes:
              type: string
              description: User-provided notes about the key.
            redirect_uri:
              type: string
              description: Deprecated in favor of redirect_uris. Do not use.
            redirect_uris:
              type: array
              items:
                type: string
              description: >-
                List of URLs used during OAuth2 flow to validate given redirect
                URI.
            vendor_code:
              type: string
              description: User-specified code representing the vendor that uses the key.
            visible:
              type: boolean
              description: 'Defaults to true. If false, key will not be visible in the UI.'
            test_cluster_only:
              type: boolean
              description: >-
                Defaults to false. If true, key is only usable in non-production
                environments (test, beta).
            client_credentials_audience:
              type: string
              description: >-
                Used in OAuth2 client credentials flow to specify the audience
                for the access token.
            scopes:
              type: array
              items:
                type: string
              description: List of API endpoints key is allowed to access.
            require_scopes:
              type: boolean
              description: 'If true, then token requests with this key must include scopes.'
            allow_includes:
              type: boolean
              description: >-
                If true, allows ‘includes’ parameters in API requests that match
                the scopes of this key.
