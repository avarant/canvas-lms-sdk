      description: Returns a paginated list of authentication providers for the account.
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          description: ID of the account
          schema:
            type: integer
      responses:
        '200':
          description: A list of AuthenticationProvider objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticationProvider'
    post:
      tags:
        - Authentication Providers
      summary: Add authentication provider
      description: >
        Add external authentication provider(s) for the account.  

        See provider-specific parameters (auth_type required, plus other fields
        depending on auth_type).
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          description: ID of the account
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                auth_type:
                  type: string
                  description: >-
                    Type of provider (apple, cas, facebook, github, google,
                    ldap, linkedin, microsoft, openid_connect, saml, etc.)
                position:
                  type: integer
                  description: Position/order of this provider (1 = default)
                jit_provisioning:
                  type: boolean
                  description: Enable just-in-time provisioning (not for Canvas type)
                mfa_required:
                  type: boolean
                  description: Require MFA on login via this provider
              required:
                - auth_type
      responses:
        '200':
          description: The created AuthenticationProvider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationProvider'
