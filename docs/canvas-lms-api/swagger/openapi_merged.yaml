  '/api/v1/courses/{course_id}/discussion_topics':
    get:
      summary: Returns the paginated list of discussion topics for a course.
      description: Returns the paginated list of discussion topics for this course.
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the course.
        - name: 'include[]'
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - all_dates
                - sections
                - sections_user_count
                - overrides
          description: >
            If “all_dates” is passed, all dates associated with graded
            discussions’ assignments will be included. If “sections” is passed,
            includes the course sections that are associated with the topic. If
            “sections_user_count” is passed, then either (a) if sections were
            asked for *and* the topic is specific to certain course sections,
            includes the number of users in each section; or (b) includes at the
            root level the total number of users in the topic's context. If
            “overrides” is passed, the overrides for the assignment will be
            included.
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - position
              - recent_activity
              - title
          description: >-
            Determines the order of the discussion topic list. Defaults to
            “position”.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - locked
              - unlocked
              - pinned
              - unpinned
          description: >
            Only return discussion topics in the given state(s). Defaults to
            including all topics. Filtering is done after pagination.
        - name: only_announcements
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Return announcements instead of discussion topics. Defaults to
            false.
        - name: filter_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - unread
          description: >-
            The state of the discussion topic to return. Currently only supports
            “unread”.
        - name: search_term
          in: query
          required: false
          schema:
            type: string
          description: The partial title of the discussion topics to match and return.
        - name: exclude_context_module_locked_topics
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            For students, exclude topics that are locked by module progression.
            Defaults to false.
      responses:
        '200':
          description: A list of DiscussionTopic objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscussionTopic'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
