  '/api/lti/accounts/{account_id}/authorize':
    post:
      summary: Retrieve a JWT access token
      description: >
        Obtain a JWT access token for fetching custom Tool Consumer Profiles,
        registering Tool Proxies, or accessing LTI2 API endpoints (e.g.,
        originality reports).
      tags:
        - LTI2
        - Authentication
      parameters:
        - name: account_id
          in: path
          description: Canvas account ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: >
                    Grant type of the request.

                    Use "authorization_code" to retrieve a token for custom TCPs
                    and tool proxy registration.

                    Use "urn:ietf:params:oauth:grant-type:jwt-bearer" to
                    retrieve a token for LTI2 API use.
                  enum:
                    - authorization_code
                    - 'urn:ietf:params:oauth:grant-type:jwt-bearer'
                assertion:
                  type: string
                  description: Signed JWT assertion
                code:
                  type: string
                  description: >-
                    Registration key (reg_key) from the initial registration
                    message; required when grant_type=authorization_code
              required:
                - grant_type
                - assertion
      responses:
        '200':
          description: Successful token retrieval
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token
                  token_type:
                    type: string
                    description: Token type (bearer)
                  expires_in:
                    type: integer
                    description: Token lifetime in seconds
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                token_type: bearer
                expires_in: 3600
        '400':
          description: Bad Request – malformed parameters
        '401':
          description: Unauthorized – invalid assertion or grant_type
        '500':
          description: Internal Server Error
      security: []
