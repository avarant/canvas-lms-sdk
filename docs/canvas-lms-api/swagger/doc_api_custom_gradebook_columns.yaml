openapi: "3.0.0"
info:
  title: Custom Gradebook Columns API
  version: "1.0.0"
paths:
  /api/v1/courses/{course_id}/custom_gradebook_columns:
    get:
      summary: List custom gradebook columns
      description: A paginated list of all custom gradebook columns for a course.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: include_hidden
          in: query
          description: Include hidden parameters (defaults to false)
          schema:
            type: boolean
      responses:
        '200':
          description: A list of CustomColumn objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomColumn'
    post:
      summary: Create a custom gradebook column
      description: Create a custom gradebook column.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column:
                  type: object
                  properties:
                    title:
                      type: string
                    position:
                      type: integer
                    hidden:
                      type: boolean
                    teacher_notes:
                      type: boolean
                    read_only:
                      type: boolean
                  required:
                    - title
      responses:
        '200':
          description: Created CustomColumn object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomColumn'
  /api/v1/courses/{course_id}/custom_gradebook_columns/{id}:
    put:
      summary: Update a custom gradebook column
      description: Accepts the same parameters as custom gradebook column creation.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column:
                  type: object
                  properties:
                    title:
                      type: string
                    position:
                      type: integer
                    hidden:
                      type: boolean
                    teacher_notes:
                      type: boolean
                    read_only:
                      type: boolean
      responses:
        '200':
          description: Updated CustomColumn object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomColumn'
    delete:
      summary: Delete a custom gradebook column
      description: Permanently deletes a custom column and its associated data.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted CustomColumn object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomColumn'
  /api/v1/courses/{course_id}/custom_gradebook_columns/reorder:
    post:
      summary: Reorder custom columns
      description: Puts the given columns in the specified order.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items:
                    type: integer
              required:
                - order
      responses:
        '200':
          description: OK
  /api/v1/courses/{course_id}/custom_gradebook_columns/{id}/data:
    get:
      summary: List entries for a column
      description: This does not list entries for students without associated data.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: include_hidden
          in: query
          description: If true, hidden columns will be included. Defaults to false.
          schema:
            type: boolean
      responses:
        '200':
          description: A list of ColumnDatum objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnDatum'
  /api/v1/courses/{course_id}/custom_gradebook_columns/{id}/data/{user_id}:
    put:
      summary: Update column data
      description: Set the content of a custom column. Setting content to blank will delete the datum.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column_data:
                  type: object
                  properties:
                    content:
                      type: string
                  required:
                    - content
      responses:
        '200':
          description: Updated ColumnDatum object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnDatum'
  /api/v1/courses/{course_id}/custom_gradebook_column_data:
    put:
      summary: Bulk update column data
      description: Set the content of custom columns in bulk. Empty content strings delete data objects.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column_data:
                  type: array
                  items:
                    type: object
                    properties:
                      column_id:
                        type: integer
                      user_id:
                        type: integer
                      content:
                        type: string
                    required:
                      - column_id
                      - user_id
                      - content
              required:
                - column_data
      responses:
        '200':
          description: Bulk update progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
components:
  schemas:
    CustomColumn:
      type: object
      properties:
        id:
          type: integer
        teacher_notes:
          type: boolean
        title:
          type: string
        position:
          type: integer
        hidden:
          type: boolean
        read_only:
          type: boolean
    ColumnDatum:
      type: object
      properties:
        content:
          type: string
        user_id:
          type: integer
    Progress:
      type: object
      description: Progress of a bulk update operation.