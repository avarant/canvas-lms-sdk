components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
  schemas:
    Feature:
      type: object
      properties:
        feature:
          type: string
          description: The symbolic name of the feature
        display_name:
          type: string
          description: The user-visible name of the feature
        applies_to:
          type: string
          description: The type of object the feature applies to
          enum:
            - RootAccount
            - Account
            - Course
            - User
        feature_flag:
          $ref: '#/components/schemas/FeatureFlag'
        root_opt_in:
          type: boolean
          description: Whether root accounts opt in by default
        beta:
          type: boolean
          description: Whether the feature is a feature preview
        autoexpand:
          type: boolean
          description: Whether feature details are autoexpanded
        release_notes_url:
          type: string
          format: uri
          description: URL to the release notes describing the feature
    FeatureFlag:
      type: object
      properties:
        context_type:
          type: string
          description: The type of object to which this flag applies
          enum:
            - Account
            - Course
            - User
        context_id:
          type: integer
          description: The id of the object to which this flag applies
        feature:
          type: string
          description: The feature this flag controls
        state:
          type: string
          description: The policy for the feature at this context
          enum:
            - off
            - allowed
            - allowed_on
            - on
        locked:
          type: boolean
          description: Whether this flag is locked by a higher context
      required:
        - feature
        - state
        - locked