openapi: "3.0.0"
info:
  title: Canvas LMS Feature Flags API
  description: Manage optional features in Canvas.
  version: "1.0.0"
servers:
  - url: https://canvas.example.com
paths:
  /api/v1/courses/{course_id}/features:
    get:
      tags:
        - Feature Flags
      summary: List features
      description: A paginated list of all features that apply to a given Account, Course, or User.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: Course ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of Feature objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
  /api/v1/accounts/{account_id}/features:
    get:
      tags:
        - Feature Flags
      summary: List features
      description: A paginated list of all features that apply to a given Account, Course, or User.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: Account ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of Feature objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
  /api/v1/users/{user_id}/features:
    get:
      tags:
        - Feature Flags
      summary: List features
      description: A paginated list of all features that apply to a given Account, Course, or User.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of Feature objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
  /api/v1/courses/{course_id}/features/enabled:
    get:
      tags:
        - Feature Flags
      summary: List enabled features
      description: A paginated list of all features that are enabled on a given Account, Course, or User. Only feature names are returned.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: Course ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of enabled feature names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/accounts/{account_id}/features/enabled:
    get:
      tags:
        - Feature Flags
      summary: List enabled features
      description: A paginated list of all features that are enabled on a given Account, Course, or User. Only feature names are returned.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: Account ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of enabled feature names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/users/{user_id}/features/enabled:
    get:
      tags:
        - Feature Flags
      summary: List enabled features
      description: A paginated list of all features that are enabled on a given Account, Course, or User. Only feature names are returned.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of enabled feature names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/features/environment:
    get:
      tags:
        - Feature Flags
      summary: List environment features
      description: Return a hash of global feature options that pertain to the Canvas user interface.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A map of feature flags to their global enabled state
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
  /api/v1/courses/{course_id}/features/flags/{feature}:
    get:
      tags:
        - Feature Flags
      summary: Get feature flag
      description: Get the feature flag that applies to a given Account, Course, or User.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: Course ID
        - name: feature
          in: path
          required: true
          schema:
            type: string
          description: The symbolic name of the feature
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A FeatureFlag object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
    put:
      tags:
        - Feature Flags
      summary: Set feature flag
      description: Set a feature flag for a given Account, Course, or User.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: Course ID
        - name: feature
          in: path
          required: true
          schema:
            type: string
          description: The symbolic name of the feature
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state:
                  type: string
                  description: |
                    off: The feature is not available for the course, user, or account and sub-accounts.
                    allowed: (valid only on accounts) The feature is off in the account, but may be enabled in sub-accounts and courses.
                    on: The feature is turned on unconditionally for the user, course, or account and sub-accounts.
                  enum:
                    - off
                    - allowed
                    - on
              required:
                - state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated FeatureFlag object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
    delete:
      tags:
        - Feature Flags
      summary: Remove feature flag
      description: Remove a feature flag for a given Account, Course, or User. The object will inherit flags from a higher context.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
          description: Course ID
        - name: feature
          in: path
          required: true
          schema:
            type: string
          description: The symbolic name of the feature
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The removed (or inherited) FeatureFlag object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
  /api/v1/accounts/{account_id}/features/flags/{feature}:
    get:
      tags:
        - Feature Flags
      summary: Get feature flag
      description: Get the feature flag that applies to a given Account, Course, or User.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: Account ID
        - name: feature
          in: path
          required: true
          schema:
            type: string
          description: The symbolic name of the feature
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A FeatureFlag object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
    put:
      tags:
        - Feature Flags
      summary: Set feature flag
      description: Set a feature flag for a given Account, Course, or User.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: Account ID
        - name: feature
          in: path
          required: true
          schema:
            type: string
          description: The symbolic name of the feature
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state:
                  type: string
                  description: |
                    off: The feature is not available for the course, user, or account and sub-accounts.
                    allowed: (valid only on accounts) The feature is off in the account, but may be enabled in sub-accounts and courses.
                    on: The feature is turned on unconditionally for the user, course, or account and sub-accounts.
                  enum:
                    - off
                    - allowed
                    - on
              required:
                - state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated FeatureFlag object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
    delete:
      tags:
        - Feature Flags
      summary: Remove feature flag
      description: Remove a feature flag for a given Account, Course, or User. The object will inherit flags from a higher context.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
          description: Account ID
        - name: feature
          in: path
          required: true
          schema:
            type: string
          description: The symbolic name of the feature
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The removed (or inherited) FeatureFlag object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
  /api/v1/users/{user_id}/features/flags/{feature}:
    get:
      tags:
        - Feature Flags
      summary: Get feature flag
      description: Get the feature flag that applies to a given Account, Course, or User.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
        - name: feature
          in: path
          required: true
          schema:
            type: string
          description: The symbolic name of the feature
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A FeatureFlag object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
    put:
      tags:
        - Feature Flags
      summary: Set feature flag
      description: Set a feature flag for a given Account, Course, or User.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
        - name: feature
          in: path
          required: true
          schema:
