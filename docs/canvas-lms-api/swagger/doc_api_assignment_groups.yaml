openapi: 3.0.0
info:
  title: Canvas LMS - Assignment Groups API
  version: 1.0.0
paths:
  /api/v1/courses/{course_id}/assignment_groups:
    get:
      summary: List assignment groups
      description: Returns the paginated list of assignment groups for the current context. The returned groups are sorted by their position field.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: include
          in: query
          description: >-
            Associations to include with the group. “discussion_topic”, “all_dates”, “can_edit”,
            “assignment_visibility” & “submission” are only valid if “assignments” is also included.
            “score_statistics” requires that the “assignments” and “submission” options are included.
            The “assignment_visibility” option additionally requires that the Differentiated Assignments
            course feature be turned on. If “observed_users” is passed along with “assignments”
            and “submission”, submissions for observed users will also be included.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - assignments
                - discussion_topic
                - all_dates
                - assignment_visibility
                - overrides
                - submission
                - observed_users
                - can_edit
                - score_statistics
        - name: assignment_ids
          in: query
          description: >-
            If “assignments” are included, optionally return only assignments having their ID
            in this array. This argument may also be passed as a comma separated string.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: exclude_assignment_submission_types
          in: query
          description: >-
            If “assignments” are included, those with the specified submission types will be
            excluded from the assignment groups.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - online_quiz
                - discussion_topic
                - wiki_page
                - external_tool
        - name: override_assignment_dates
          in: query
          description: Apply assignment overrides for each assignment, defaults to true.
          required: false
          schema:
            type: boolean
        - name: grading_period_id
          in: query
          description: >-
            The id of the grading period in which assignment groups are being requested
            (Requires grading periods to exist.)
          required: false
          schema:
            type: integer
        - name: scope_assignments_to_student
          in: query
          description: >-
            If true, all assignments returned will apply to the current user in the specified
            grading period. If assignments apply to other students in the specified grading
            period, but not the current user, they will not be returned. (Requires the
            grading_period_id argument and grading periods to exist. In addition, the current
            user must be a student.)
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successful response with a list of AssignmentGroup objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentGroup'
    post:
      summary: Create an Assignment Group
      description: Create a new assignment group for this course.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The assignment group’s name
                position:
                  type: integer
                  description: The position of this assignment group in relation to the other assignment groups
                group_weight:
                  type: number
                  description: The percent of the total grade that this assignment group represents
                sis_source_id:
                  type: string
                  description: The sis source id of the Assignment Group
                integration_data:
                  type: object
                  additionalProperties:
                    type: string
                  description: The integration data of the Assignment Group
      responses:
        '201':
          description: AssignmentGroup created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentGroup'
  /api/v1/courses/{course_id}/assignment_groups/{assignment_group_id}:
    get:
      summary: Get an Assignment Group
      description: Returns the assignment group with the given id.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: assignment_group_id
          in: path
          required: true
          schema:
            type: integer
        - name: include
          in: query
          description: >-
            Associations to include with the group. “discussion_topic” and “assignment_visibility”
            and “submission” are only valid if “assignments” is also included. “score_statistics”
            is only valid if “submission” and “assignments” are also included. The
            “assignment_visibility” option additionally requires that the Differentiated Assignments
            course feature be turned on.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - assignments
                - discussion_topic
                - assignment_visibility
                - submission
                - score_statistics
        - name: override_assignment_dates
          in: query
          description: Apply assignment overrides for each assignment, defaults to true.
          required: false
          schema:
            type: boolean
        - name: grading_period_id
          in: query
          description: >-
            The id of the grading period in which assignment groups are being requested
            (Requires grading periods to exist on the account)
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response with an AssignmentGroup object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentGroup'
    put:
      summary: Edit an Assignment Group
      description: Modify an existing Assignment Group.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: assignment_group_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The assignment group’s name
                position:
                  type: integer
                  description: The position of this assignment group in relation to the other assignment groups
                group_weight:
                  type: number
                  description: The percent of the total grade that this assignment group represents
                sis_source_id:
                  type: string
                  description: The sis source id of the Assignment Group
                integration_data:
                  type: object
                  additionalProperties:
                    type: string
                  description: The integration data of the Assignment Group
                rules:
                  $ref: '#/components/schemas/GradingRules'
      responses:
        '200':
          description: AssignmentGroup updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentGroup'
    delete:
      summary: Destroy an Assignment Group
      description: Deletes the assignment group with the given id.
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
        - name: assignment_group_id
          in: path
          required: true
          schema:
            type: integer
        - name: move_assignments_to
          in: query
          description: >-
            The ID of an active Assignment Group to which the assignments that are currently
            assigned to the destroyed Assignment Group will be assigned. If not provided,
            assignments in this Assignment Group will be deleted.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: AssignmentGroup destroyed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentGroup'
components:
  schemas:
    GradingRules:
      type: object
      properties:
        drop_lowest:
          type: integer
          description: Number of lowest scores to be dropped for each user.
        drop_highest:
          type: integer
          description: Number of highest scores to be dropped for each user.
        never_drop:
          type: array
          description: Assignment IDs that should never be dropped.
          items:
            type: integer
      required:
        - drop_lowest
        - drop_highest
        - never_drop
    AssignmentGroup:
      type: object
      properties:
        id:
          type: integer
          description: The id of the Assignment Group
        name:
          type: string
          description: The name of the Assignment Group
        position:
          type: integer
          description: The position of the Assignment Group
        group_weight:
          type: number
          description: The weight of the Assignment Group
        sis_source_id:
          type: string
          description: The sis source id of the Assignment Group
        integration_data:
          type: object
          additionalProperties:
            type: string
          description: The integration data of the Assignment Group
        assignments:
          type: array
          description: The assignments in this Assignment Group
          items:
            type: object
        rules:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/GradingRules'
            - type: 'null'
      required:
        - id
        - name
        - position
        - group_weight
security: []