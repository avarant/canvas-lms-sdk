/api/v1/courses/{course_id}/quizzes/{id}/submission_users/message:
  post:
    summary: Send a message to unsubmitted or submitted users for the quiz
    tags:
      - Quiz Submission User List
    parameters:
      - name: course_id
        in: path
        description: ID of the course
        required: true
        schema:
          type: integer
      - name: id
        in: path
        description: ID of the quiz
        required: true
        schema:
          type: integer
    requestBody:
      description: Body and recipients to send the message to
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - body
              - recipients
              - subject
            properties:
              body:
                type: string
                description: Message body of the conversation to be created
                example: "Please take the quiz."
              recipients:
                type: string
                description: Who to send the message to. May be either 'submitted' or 'unsubmitted'
                example: "submitted"
                enum:
                  - submitted
                  - unsubmitted
              subject:
                type: string
                description: Subject of the new Conversation created
                example: "ATTN: Quiz 101 Students"
    responses:
      '200':
        description: Successful response
      '400':
        description: Bad Request
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        description: Course or quiz not found