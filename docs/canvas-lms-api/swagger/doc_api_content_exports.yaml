                      oneOf:
                        - type: integer
                        - type: string
      responses:
        '200':
          description: Content export job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentExport'
  /api/v1/users/{user_id}/content_exports/{id}:
    get:
      summary: Show content export
      description: Retrieve information about a single content export for a user.
      parameters:
        - name: user_id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: ID of the content export job
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A ContentExport object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentExport'
components:
  schemas:
    ContentExport:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the export
        created_at:
          type: string
          format: date-time
          description: The date and time this export was requested
        export_type:
          type: string
          description: The type of content migration
          enum:
            - common_cartridge
            - qti
            - zip
        attachment:
          type: object
          description: Attachment API object for the export package (not present before completion)
          properties:
            url:
              type: string
              format: uri
        progress_url:
          type: string
          format: uri
          description: The API endpoint for polling the current progress
        user_id:
          type: integer
          description: The ID of the user who started the export
        workflow_state:
          type: string
          description: Current state of the content migration
          enum:
            - created
            - exporting
            - exported
            - failed
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer