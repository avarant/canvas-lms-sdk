<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas LMS API Docs</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #fafafa; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // Begin Swagger UI call region
            const ui = SwaggerUIBundle({
                urls: [
                    { url: "doc_api_sections.yaml", name: "Sections API" },
                    { url: "doc_api_search.yaml", name: "Search API" },
                    { url: "doc_api_tabs.yaml", name: "Tabs API" },
                    { url: "doc_api_temporary_enrollment_pairings.yaml", name: "Temporary Enrollment Pairings API" },
                    { url: "doc_api_user_observees.yaml", name: "User Observees API" },
                    { url: "doc_api_file.jwt_access_tokens.yaml", name: "JWT Access Tokens API" },
                    { url: "doc_api_shared_brand_configs.yaml", name: "Shared Brand Configs API" },
                    { url: "doc_api_submission_comments.yaml", name: "Submission Comments API" },
                    { url: "doc_api_what_if_grades.yaml", name: "What If Grades API" },
                    { url: "doc_api_sis_import_errors.yaml", name: "SIS Import Errors API" },
                    { url: "doc_api_plagiarism_detection_platform_assignments.yaml", name: "Plagiarism Platform Assignments API" },
                    { url: "doc_api_file.xapi.yaml", name: "xAPI" },
                    { url: "doc_api_webhooks_subscriptions_for_plagiarism_platform.yaml", name: "Plagiarism Webhooks API" },
                    { url: "doc_api_plagiarism_detection_submissions.yaml", name: "Plagiarism Submissions API" },
                    { url: "doc_api_smart_search.yaml", name: "Smart Search API" },
                    { url: "doc_api_file.pns.yaml", name: "Push Notifications API" },
                    { url: "doc_api_services.yaml", name: "Services API" },
                    { url: "doc_api_file.data_service_canvas_outcomes.yaml", name: "Data Service Outcomes API" },
                    { url: "doc_api_plagiarism_detection_platform_users.yaml", name: "Plagiarism Platform Users API" },
                    { url: "doc_api_new_quiz_items.yaml", name: "New Quiz Items API" },
                    { url: "doc_api_discussion_topics.yaml", name: "Discussion Topics API" },
                    { url: "doc_api_poll_sessions.yaml", name: "Poll Sessions API" },
                    { url: "doc_api_quizzes.yaml", name: "Quizzes API" },
                    { url: "doc_api_lti_registrations.yaml", name: "LTI Registrations API" },
                    { url: "doc_api_external_tools.yaml", name: "External Tools API" },
                    { url: "doc_api_courses.yaml", name: "Courses API" },
                    { url: "doc_api_accounts.yaml", name: "Accounts API" },
                    { url: "doc_api_assignments.yaml", name: "Assignments API" },
                    { url: "doc_api_assignment_groups.yaml", name: "Assignment Groups API" },
                    { url: "doc_api_lti_resource_links.yaml", name: "LTI Resource Links API" },
                    { url: "doc_api_account_reports.yaml", name: "Account Reports API" },
                    { url: "doc_api_outcome_imports.yaml", name: "Outcome Imports API" },
                    { url: "doc_api_pages.yaml", name: "Pages API" },
                    { url: "doc_api_planner.yaml", name: "Planner API" },
                    { url: "doc_api_new_quizzes.yaml", name: "New Quizzes API" },
                    { url: "doc_api_conversations.yaml", name: "Conversations API" },
                    { url: "doc_api_content_migrations.yaml", name: "Content Migrations API" },
                    { url: "doc_api_files.yaml", name: "Files API" },
                    { url: "doc_api_enrollment_terms.yaml", name: "Enrollment Terms API" },
                    { url: "doc_api_enrollments.yaml", name: "Enrollments API" },
                    { url: "doc_api_quiz_questions.yaml", name: "Quiz Questions API" },
                    { url: "doc_api_quiz_submission_questions.yaml", name: "Quiz Submission Questions API" },
                    { url: "doc_api_content_shares.yaml", name: "Content Shares API" },
                    { url: "doc_api_groups.yaml", name: "Groups API" },
                    { url: "doc_api_developer_keys.yaml", name: "Developer Keys API" },
                    { url: "doc_api_group_categories.yaml", name: "Group Categories API" },
                    { url: "doc_api_authentication_providers.yaml", name: "Authentication Providers API" },
                    { url: "doc_api_account_notifications.yaml", name: "Account Notifications API" },
                    { url: "doc_api_e_portfolios.yaml", name: "E-Portfolios API" },
                    { url: "doc_api_media_objects.yaml", name: "Media Objects API" },
                    { url: "doc_api_outcome_results.yaml", name: "Outcome Results API" }
                ],
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout"
            })
            // End Swagger UI call region
            window.ui = ui
        }
    </script>
</body>
</html>
