openapi: 3.0.0
info:
  title: Announcement External Feeds API
  version: 1.0.0
paths:
  /api/v1/courses/{course_id}/external_feeds:
    get:
      summary: List external feeds for a course
      tags:
        - Announcement External Feeds
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of external feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalFeed'
    post:
      summary: Create an external feed for a course
      tags:
        - Announcement External Feeds
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL to the external RSS or Atom feed
                header_match:
                  type: string
                  description: If given, only feed entries whose title contains this string will be imported
                verbosity:
                  type: string
                  description: How much of the feed content to import
                  enum:
                    - full
                    - truncate
                    - link_only
      responses:
        '200':
          description: The created external feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalFeed'
  /api/v1/courses/{course_id}/external_feeds/{external_feed_id}:
    delete:
      summary: Delete an external feed from a course
      tags:
        - Announcement External Feeds
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
        - name: external_feed_id
          in: path
          description: ID of the external feed to delete
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The deleted external feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalFeed'
  /api/v1/groups/{group_id}/external_feeds:
    get:
      summary: List external feeds for a group
      tags:
        - Announcement External Feeds
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          description: ID of the group
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of external feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalFeed'
    post:
      summary: Create an external feed for a group
      tags:
        - Announcement External Feeds
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          description: ID of the group
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: The URL to the external RSS or Atom feed
                header_match:
                  type: string
                  description: If given, only feed entries whose title contains this string will be imported
                verbosity:
                  type: string
                  description: How much of the feed content to import
                  enum:
                    - full
                    - truncate
                    - link_only
      responses:
        '200':
          description: The created external feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalFeed'
  /api/v1/groups/{group_id}/external_feeds/{external_feed_id}:
    delete:
      summary: Delete an external feed from a group
      tags:
        - Announcement External Feeds
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          description: ID of the group
          required: true
          schema:
            type: integer
        - name: external_feed_id
          in: path
          description: ID of the external feed to delete
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The deleted external feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalFeed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
  schemas:
    ExternalFeed:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the feed
        display_name:
          type: string
          description: The title of the feed
        url:
          type: string
          description: The HTTP/HTTPS URL to the feed
        header_match:
          type: string
          nullable: true
          description: If set, only entries whose title contains this string trigger announcements
        created_at:
          type: string
          format: date-time
          description: When the external feed was added
        verbosity:
          type: string
          description: Amount of feed content imported
          enum:
            - full
            - truncate
            - link_only
      required:
        - id
        - display_name
        - url
        - created_at
        - verbosity