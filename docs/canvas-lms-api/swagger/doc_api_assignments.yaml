openapi: 3.0.0
info:
  title: Canvas LMS Assignments API
  version: 1.0.0
paths:
  /api/v1/courses/{course_id}/assignments/{id}:
    delete:
      summary: Delete the given assignment
      description: Deletes the specified assignment and returns the deleted Assignment object.
      operationId: deleteAssignment
      parameters:
        - name: course_id
          in: path
          description: ID of the course
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: ID of the assignment to delete
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully deleted assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '404':
          description: Assignment not found
        '401':
          description: Unauthorized – invalid or missing authentication token
        '500':
          description: Internal server error
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Assignment:
      type: object
      description: An Assignment object
      properties:
        id:
          type: integer
          description: The ID of the assignment
        name:
          type: string
          description: The name of the assignment
        description:
          type: string
          description: The assignment description, in an HTML fragment
        created_at:
          type: string
          format: date-time
          description: Time at which this assignment was originally created
        updated_at:
          type: string
          format: date-time
          description: Time at which this assignment was last modified
        due_at:
          type: string
          format: date-time
          nullable: true
          description: The due date for the assignment
        lock_at:
          type: string
          format: date-time
          nullable: true
          description: The lock date for the assignment
        unlock_at:
          type: string
          format: date-time
          nullable: true
          description: The unlock date for the assignment
        course_id:
          type: integer
          description: The ID of the course the assignment belongs to
        html_url:
          type: string
          format: uri
          description: URL to the assignment's web page
        points_possible:
          type: number
          description: The maximum points possible for the assignment
        grading_type:
          type: string
          description: The type of grading the assignment receives
      required:
        - id
        - name
        - created_at
        - updated_at
        - course_id
        - html_url
        - points_possible
        - grading_type