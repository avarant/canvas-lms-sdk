/api/v1/courses/{course_id}/assignments/{id}:
  delete:
    summary: Delete the given assignment.
    description: Deletes the assignment identified by course_id and id.
    tags:
      - Assignments
    security:
      - bearerAuth: []
    parameters:
      - name: course_id
        in: path
        description: ID of the course
        required: true
        schema:
          type: integer
      - name: id
        in: path
        description: ID of the assignment
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Assignment deleted successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
      '401':
        description: Unauthorized – invalid or missing authentication credentials
      '403':
        description: Forbidden – insufficient permissions to delete the assignment
      '404':
        description: Assignment not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Assignment:
      type: object
      description: An Assignment object
      properties:
        id:
          type: integer
          description: The ID of the assignment
        name:
          type: string
          description: The name of the assignment
        html_url:
          type: string
          format: uri
          description: URL to the assignment's web page
        # ... (other properties as defined in the Assignment model)
      # Note: For full schema, refer to the Assignment object definition in documentation.