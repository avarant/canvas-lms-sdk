openapi: 3.0.0
info:
  title: Canvas LMS Notification Preferences API
  version: "1.0"
paths:
  /api/v1/users/{user_id}/communication_channels/{communication_channel_id}/notification_preferences:
    get:
      summary: Fetch all preferences for the given communication channel
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: communication_channel_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A list of notification preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
    put:
      summary: Change the preferences for multiple notifications for a single communication channel at once
      security:
        - bearerAuth: []
      parameters:
        - name: communication_channel_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  frequency:
                    type: string
                required:
                  - frequency
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'

  /api/v1/users/{user_id}/communication_channels/{type}/{address}/notification_preferences:
    get:
      summary: Fetch all preferences for the given communication channel (by type and address)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: Communication channel type
        - name: address
          in: path
          required: true
          schema:
            type: string
          description: Communication channel address
      responses:
        "200":
          description: A list of notification preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
    put:
      summary: Change the preferences for multiple notifications for a single communication channel at once (by type and address)
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: address
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  frequency:
                    type: string
                required:
                  - frequency
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'

  /api/v1/users/{user_id}/communication_channels/{communication_channel_id}/notification_preference_categories:
    get:
      summary: Fetch all notification preference categories for the given communication channel
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: communication_channel_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A list of notification preference categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/v1/users/{user_id}/communication_channels/{communication_channel_id}/notification_preferences/{notification}:
    get:
      summary: Fetch the preference for the given notification for the given communication channel
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: communication_channel_id
          in: path
          required: true
          schema:
            type: integer
        - name: notification
          in: path
          required: true
          schema:
            type: string
          description: The notification identifier
      responses:
        "200":
          description: A notification preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'

  /api/v1/users/{user_id}/communication_channels/{type}/{address}/notification_preferences/{notification}:
    get:
      summary: Fetch the preference for the given notification for the given communication channel (by type and address)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: address
          in: path
          required: true
          schema:
            type: string
        - name: notification
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A notification preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'

  /api/v1/users/self/communication_channels/{communication_channel_id}/notification_preferences/{notification}:
    put:
      summary: Change the preference for a single notification for a single communication channel
      security:
        - bearerAuth: []
      parameters:
        - name: communication_channel_id
          in: path
          required: true
          schema:
            type: integer
        - name: notification
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                notification_preferences:
                  type: object
                  properties:
                    frequency:
                      type: string
                  required:
                    - frequency
              required:
                - notification_preferences
      responses:
        "200":
          description: Updated notification preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'

  /api/v1/users/self/communication_channels/{communication_channel_id}/notification_preference_categories/{category}:
    put:
      summary: Change the preferences for multiple notifications based on the category for a single communication channel
      security:
        - bearerAuth: []
      parameters:
        - name: communication_channel_id
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: path
          required: true
          schema:
            type: string
          description: The name of the category (parameterized, e.g. course_content)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                notification_preferences:
                  type: object
                  properties:
                    frequency:
                      type: string
                  required:
                    - frequency
              required:
                - notification_preferences
      responses:
        "200":
          description: Updated notification preferences for category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    NotificationPreference:
      type: object
      properties:
        href:
          type: string
          format: uri
        notification:
          type: string
        category:
          type: string
        frequency:
          type: string
          enum:
            - immediately
            - daily
            - weekly
            - never
      required:
        - href
        - notification
        - category
        - frequency