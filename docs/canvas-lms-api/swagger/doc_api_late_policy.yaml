openapi: 3.0.0
info:
  title: Late Policy API
  version: 1.0.0
paths:
  /api/v1/courses/{id}/late_policy:
    get:
      summary: Returns the late policy for a course.
      parameters:
        - name: id
          in: path
          description: Unique identifier for the course.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response with late policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  late_policy:
                    $ref: '#/components/schemas/LatePolicy'
    post:
      summary: Create a late policy. If the course already has a late policy, a bad_request is returned since there can only be one late policy per course.
      parameters:
        - name: id
          in: path
          description: Unique identifier for the course.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                late_policy:
                  type: object
                  properties:
                    missing_submission_deduction_enabled:
                      type: boolean
                      description: Whether to enable the missing submission deduction late policy.
                    missing_submission_deduction:
                      type: number
                      description: How many percentage points to deduct from a missing submission.
                    late_submission_deduction_enabled:
                      type: boolean
                      description: Whether to enable the late submission deduction late policy.
                    late_submission_deduction:
                      type: number
                      description: How many percentage points to deduct per the late submission interval.
                    late_submission_interval:
                      type: string
                      description: The interval for late submission deductions (e.g., "hour").
                    late_submission_minimum_percent_enabled:
                      type: boolean
                      description: Whether to enable the late submission minimum percent for a late policy.
                    late_submission_minimum_percent:
                      type: number
                      description: The minimum grade a submission can have in percentage points.
      responses:
        '200':
          description: Late policy created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  late_policy:
                    $ref: '#/components/schemas/LatePolicy'
        '400':
          description: Bad Request – a late policy already exists for the course.
    patch:
      summary: Patch a late policy. No body is returned upon success.
      parameters:
        - name: id
          in: path
          description: Unique identifier for the course.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                late_policy:
                  type: object
                  properties:
                    missing_submission_deduction_enabled:
                      type: boolean
                      description: Whether to enable the missing submission deduction late policy.
                    missing_submission_deduction:
                      type: number
                      description: How many percentage points to deduct from a missing submission.
                    late_submission_deduction_enabled:
                      type: boolean
                      description: Whether to enable the late submission deduction late policy.
                    late_submission_deduction:
                      type: number
                      description: How many percentage points to deduct per the late submission interval.
                    late_submission_interval:
                      type: string
                      description: The interval for late submission deductions (e.g., "hour").
                    late_submission_minimum_percent_enabled:
                      type: boolean
                      description: Whether to enable the late submission minimum percent for a late policy.
                    late_submission_minimum_percent:
                      type: number
                      description: The minimum grade a submission can have in percentage points.
      responses:
        '204':
          description: No Content – late policy patched successfully.
        '400':
          description: Bad Request – invalid parameters.
components:
  schemas:
    LatePolicy:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the late policy.
        course_id:
          type: integer
          description: The unique identifier for the course.
        missing_submission_deduction_enabled:
          type: boolean
          description: Whether to enable missing submission deductions.
        missing_submission_deduction:
          type: number
          format: float
          description: Amount of percentage points to deduct for missing submissions.
        late_submission_deduction_enabled:
          type: boolean
          description: Whether to enable late submission deductions.
        late_submission_deduction:
          type: number
          format: float
          description: Amount of percentage points to deduct per interval.
        late_submission_interval:
          type: string
          description: Time interval for late submission deduction (e.g., "hour").
        late_submission_minimum_percent_enabled:
          type: boolean
          description: Whether to enforce a minimum percent for late submissions.
        late_submission_minimum_percent:
          type: number
          format: float
          description: The minimum score a late submission can receive in percentage points.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the late policy was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the late policy was last updated.