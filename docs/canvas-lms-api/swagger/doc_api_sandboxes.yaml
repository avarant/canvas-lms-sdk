openapi: 3.0.0
paths:
  /api/lti/uuid_map:
    get:
      summary: Download UUID Mapping for this Sandbox
      description: |
        This endpoint returns a CSV file with the UUID mapping for the sandbox. The CSV has three columns:
        - type: The object type
        - original_uuid: The UUID of an object from the template
        - new_uuid: The UUID of the corresponding object in the sandbox
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV file containing the UUID mapping
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Unauthorized – JWT access token missing or invalid
        '403':
          description: Forbidden – insufficient permissions or scope
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT