paths:
  /login/oauth2/token:
    post:
      summary: Exchange an authorization code or refresh token for an access token
      description: |
        To get a new access token and refresh token (authorization_code grant),
        or to refresh an existing access token (refresh_token grant), send a POST
        request to this endpoint with the appropriate parameters.
      tags:
        - OAuth2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                  description: The OAuth2 grant type to use.
                client_id:
                  type: string
                  description: Your OAuth2 client identifier.
                client_secret:
                  type: string
                  description: Your OAuth2 client secret.
                redirect_uri:
                  type: string
                  description: >
                    The redirect URI used in the initial authorization request.
                    Required when grant_type is authorization_code.
                code:
                  type: string
                  description: >
                    The authorization code returned by Canvas.
                    Required when grant_type is authorization_code.
                refresh_token:
                  type: string
                  description: >
                    The refresh token returned by a previous token request.
                    Required when grant_type is refresh_token.
                replace_tokens:
                  type: integer
                  enum:
                    - 1
                  description: >
                    Optional. If set to 1, destroys any existing access tokens issued
                    for this client and replaces them with the new token.
              required:
                - grant_type
                - client_id
                - client_secret
      responses:
        '200':
          description: Successful token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The issued access token.
                  token_type:
                    type: string
                    description: The type of token issued (typically "Bearer").
                  expires_in:
                    type: integer
                    description: Time in seconds until the access token expires.
                  refresh_token:
                    type: string
                    description: The refresh token to obtain new access tokens.
                  scope:
                    type: string
                    description: The scopes granted by the token.
        '400':
          description: Bad Request — invalid or missing parameters
        '401':
          description: Unauthorized — invalid client credentials or invalid grant