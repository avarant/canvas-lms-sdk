openapi: 3.0.0
info:
  title: Canvas LMS SIS Import Errors API
  version: "1.0"
paths:
  /api/v1/accounts/{account_id}/sis_imports/{id}/errors:
    get:
      summary: Get SIS import error list for a specific SIS import
      description: |
        Returns the list of SIS import errors for a specific SIS import. Import errors are only stored for 30 days.
      parameters:
        - name: account_id
          in: path
          description: The ID of the account.
          required: true
          schema:
            type: integer
        - name: id
          in: path
          description: The ID of the SIS import.
          required: true
          schema:
            type: integer
        - name: failure
          in: query
          description: If set, only shows errors on a SIS import that would cause a failure.
          required: false
          schema:
            type: boolean
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of SIS import errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SisImportError'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

  /api/v1/accounts/{account_id}/sis_import_errors:
    get:
      summary: Get SIS import error list for an account
      description: |
        Returns the list of SIS import errors for an account. Import errors are only stored for 30 days.
      parameters:
        - name: account_id
          in: path
          description: The ID of the account.
          required: true
          schema:
            type: integer
        - name: failure
          in: query
          description: If set, only shows errors on a SIS import that would cause a failure.
          required: false
          schema:
            type: boolean
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of SIS import errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SisImportError'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SisImportError:
      type: object
      description: Details about an error encountered during a SIS import.
      properties:
        sis_import_id:
          type: integer
          description: The unique identifier for the SIS import.
        file:
          type: string
          description: The file where the error message occurred.
        message:
          type: string
          description: The error message from the record.
        row_info:
          type: string
          description: The contents of the line that had the error.
        row:
          type: integer
          description: The line number where the error occurred (1-based index, header row counts as row 1).
      required:
        - sis_import_id
        - file
        - message
        - row_info
        - row